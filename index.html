<script>
const CONTENT={"source":"Fotografía achegada: Coñecemos os climas / Os climas da Terra, páxinas 24–25.","lessons":[{"id":"climate","group":"base","art":"globe","gl":{"title":"Que é o clima?","cue":"Atmosfera. Un lugar. Uns 30 anos.","phrase":"O clima describe a atmosfera dun lugar ao longo duns trinta anos.","explain":"O clima é o conxunto de condicións da atmosfera dun lugar ao longo duns trinta anos. Para coñecelo, observamos as temperaturas e as precipitacións, e como se distribúen nas estacións do ano. Un só día non define o clima.","challenge":"Explica que é o clima e que observamos para coñecelo.","answer":"O clima é o conxunto de condicións da atmosfera dun lugar ao longo duns trinta anos. Coñecémolo estudando as temperaturas e as precipitacións e como se distribúen nas estacións do ano.","keyIdeas":["Un lugar durante uns trinta anos","Temperaturas e precipitacións","Como cambian nas estacións"]},"es":{"title":"¿Qué es el clima?","cue":"Atmósfera. Un lugar. Unos 30 años.","phrase":"El clima describe la atmósfera de un lugar durante unos treinta años.","explain":"El clima es el conjunto de condiciones de la atmósfera de un lugar durante unos treinta años. Para conocerlo, observamos las temperaturas y las precipitaciones, y cómo se distribuyen en las estaciones del año. Un solo día no define el clima.","challenge":"Explica qué es el clima y qué observamos para conocerlo.","answer":"El clima es el conjunto de condiciones de la atmósfera de un lugar durante unos treinta años. Lo conocemos estudiando las temperaturas y las precipitaciones y cómo se distribuyen en las estaciones del año.","keyIdeas":["Un lugar durante unos treinta años","Temperaturas y precipitaciones","Cómo cambian en las estaciones"]},"en":{"title":"What is climate?","cue":"Atmosphere. One place. About 30 years.","phrase":"Climate describes a place's atmospheric conditions over about thirty years.","explain":"Climate is the usual conditions of the atmosphere in a place over about thirty years. To understand it, we study temperatures and precipitation, including how they vary with the seasons. One day's weather does not define a climate.","challenge":"Explain what climate is and what we study to understand it.","answer":"Climate is the usual conditions of the atmosphere in a place over about thirty years. We study temperatures and precipitation and how they vary with the seasons.","keyIdeas":["One place over about thirty years","Temperatures and precipitation","How they vary with the seasons"]}},{"id":"temperature","group":"base","art":"thermometer","gl":{"title":"As temperaturas","cue":"Frío ou calor. Termómetro. Celsius (°C).","phrase":"A temperatura indica frío ou calor; mídese co termómetro en graos Celsius.","explain":"As temperaturas indican se vai calor ou frío. Para medilas usamos o termómetro e expresamos o resultado en graos Celsius, que se escriben °C. Coñecer as temperaturas nas distintas estacións axúdanos a coñecer o clima.","challenge":"Que indica a temperatura? Con que se mide e en que unidade se expresa?","answer":"A temperatura indica se vai calor ou frío. Mídese co termómetro e exprésase en graos Celsius, °C.","keyIdeas":["Calor ou frío","Termómetro","Graos Celsius: °C"]},"es":{"title":"Las temperaturas","cue":"Frío o calor. Termómetro. Celsius (°C).","phrase":"La temperatura indica frío o calor; se mide con el termómetro en grados Celsius.","explain":"Las temperaturas indican si hace calor o frío. Para medirlas usamos el termómetro y expresamos el resultado en grados Celsius, que se escriben °C. Conocer las temperaturas en las distintas estaciones nos ayuda a conocer el clima.","challenge":"¿Qué indica la temperatura? ¿Con qué se mide y en qué unidad se expresa?","answer":"La temperatura indica si hace calor o frío. Se mide con el termómetro y se expresa en grados Celsius, °C.","keyIdeas":["Calor o frío","Termómetro","Grados Celsius: °C"]},"en":{"title":"Temperature","cue":"Hot or cold. Thermometer. Celsius (°C).","phrase":"Temperature shows how hot or cold it is; a thermometer measures it in degrees Celsius.","explain":"Temperatures tell us how hot or cold it is. We use a thermometer to measure them, in degrees Celsius, written as °C. Temperatures in different seasons help us understand a place's climate.","challenge":"What does temperature tell us? What instrument and unit do we use to measure it?","answer":"Temperature tells us how hot or cold it is. We measure it with a thermometer, in degrees Celsius, °C.","keyIdeas":["Hot or cold","Thermometer","Degrees Celsius: °C"]}},{"id":"precipitation","group":"base","art":"rain","gl":{"title":"As precipitacións","cue":"Auga: choiva, neve, sarabia. Pluviómetro.","phrase":"Choiva, neve ou sarabia: a cantidade de auga mídese co pluviómetro.","explain":"As precipitacións son a auga que cae da atmosfera. Poden ser en forma de choiva, neve ou sarabia. A cantidade de auga recollida mídese co pluviómetro. Para coñecer o clima tamén importa en que estacións cae.","challenge":"Que son as precipitacións? Di as tres formas e o instrumento que as mide.","answer":"As precipitacións son a auga que cae da atmosfera en forma de choiva, neve ou sarabia. A cantidade de auga recollida mídese co pluviómetro.","keyIdeas":["Auga que cae da atmosfera","Choiva, neve e sarabia","Pluviómetro"]},"es":{"title":"Las precipitaciones","cue":"Agua: lluvia, nieve, granizo. Pluviómetro.","phrase":"Lluvia, nieve o granizo: la cantidad de agua se mide con el pluviómetro.","explain":"Las precipitaciones son el agua que cae de la atmósfera. Pueden ser en forma de lluvia, nieve o granizo. La cantidad de agua recogida se mide con el pluviómetro. Para conocer el clima también importa en qué estaciones cae.","challenge":"¿Qué son las precipitaciones? Di las tres formas y el instrumento que las mide.","answer":"Las precipitaciones son el agua que cae de la atmósfera en forma de lluvia, nieve o granizo. La cantidad de agua recogida se mide con el pluviómetro.","keyIdeas":["Agua que cae de la atmósfera","Lluvia, nieve y granizo","Pluviómetro"]},"en":{"title":"Precipitation","cue":"Water: rain, snow, hail. Rain gauge.","phrase":"Rain, snow or hail: the amount of water is measured with a rain gauge.","explain":"Precipitation is water that falls from the atmosphere. It can fall as rain, snow or hail. We measure the amount of water collected with a rain gauge. To understand a climate, we also need to know which seasons it falls in.","challenge":"What is precipitation? Name its three forms and the instrument used to measure it.","answer":"Precipitation is water that falls from the atmosphere as rain, snow or hail. The amount of water collected is measured with a rain gauge.","keyIdeas":["Water falling from the atmosphere","Rain, snow and hail","Rain gauge"]}},{"id":"zones","group":"factors","art":"zones","gl":{"title":"O ecuador e as zonas","cue":"1 cálida. 2 temperadas. 2 frías.","phrase":"Preto do ecuador vai máis calor; ao afastarnos, as temperaturas van baixando.","explain":"Preto do ecuador, os raios solares chegan máis perpendiculares e vai máis calor. Ao afastarnos del, as temperaturas van baixando. Distinguimos cinco zonas: unha cálida, dúas temperadas e dúas frías. A cálida queda no centro; as frías, nos extremos.","challenge":"Como inflúe o ecuador no clima? Nomea as cinco zonas climáticas.","answer":"Preto do ecuador, os raios solares chegan máis perpendiculares e vai máis calor. Ao afastarnos, as temperaturas baixan. Hai unha zona cálida, dúas temperadas e dúas frías.","keyIdeas":["Preto do ecuador: máis calor","Ao afastarnos: menos temperatura","Unha cálida, dúas temperadas e dúas frías"]},"es":{"title":"El ecuador y las zonas","cue":"1 cálida. 2 templadas. 2 frías.","phrase":"Cerca del ecuador hace más calor; al alejarnos, las temperaturas van bajando.","explain":"Cerca del ecuador, los rayos solares llegan más perpendiculares y hace más calor. Al alejarnos de él, las temperaturas van bajando. Distinguimos cinco zonas: una cálida, dos templadas y dos frías. La cálida queda en el centro; las frías, en los extremos.","challenge":"¿Cómo influye el ecuador en el clima? Nombra las cinco zonas climáticas.","answer":"Cerca del ecuador, los rayos solares llegan más perpendiculares y hace más calor. Al alejarnos, las temperaturas bajan. Hay una zona cálida, dos templadas y dos frías.","keyIdeas":["Cerca del ecuador: más calor","Al alejarnos: menos temperatura","Una cálida, dos templadas y dos frías"]},"en":{"title":"The equator and climate zones","cue":"1 hot. 2 temperate. 2 cold.","phrase":"Near the equator it is hotter; as we move farther away, temperatures fall.","explain":"Near the equator, the Sun's rays hit the ground more directly, so it is hotter. As we move farther away, temperatures fall. There are five climate zones: one hot, two temperate and two cold. The hot zone is in the middle; the cold zones are at the ends.","challenge":"How does distance from the equator affect climate? Name the five climate zones.","answer":"Near the equator, the Sun's rays hit the ground more directly, so it is hotter. Farther away, temperatures fall. There is one hot zone, two temperate zones and two cold zones.","keyIdeas":["Near the equator: hotter","Farther away: lower temperatures","One hot, two temperate and two cold zones"]}},{"id":"relief","group":"factors","art":"relief","gl":{"title":"O relevo: a altura","cue":"Máis altura, máis frío.","phrase":"Nas montañas vai máis frío ca nas terras de menor altura.","explain":"Nunha mesma zona climática pode haber climas distintos porque a altura cambia as temperaturas. Nas montañas vai máis frío ca nas terras de menor altura: canto máis subimos, máis baixa adoita ser a temperatura.","challenge":"Por que pode facer máis frío no alto dunha montaña ca ao seu pé?","answer":"Porque a altura inflúe na temperatura. Nas montañas vai máis frío ca nas terras de menor altura; por iso pode haber climas distintos dentro dunha mesma zona climática.","keyIdeas":["A altura inflúe na temperatura","Máis altura: máis frío","Climas distintos nunha mesma zona"]},"es":{"title":"El relieve: la altura","cue":"Más altura, más frío.","phrase":"En las montañas hace más frío que en las tierras de menor altura.","explain":"En una misma zona climática puede haber climas distintos porque la altura cambia las temperaturas. En las montañas hace más frío que en las tierras de menor altura: cuanto más subimos, más baja suele ser la temperatura.","challenge":"¿Por qué puede hacer más frío en lo alto de una montaña que a sus pies?","answer":"Porque la altura influye en la temperatura. En las montañas hace más frío que en las tierras de menor altura; por eso puede haber climas distintos dentro de una misma zona climática.","keyIdeas":["La altura influye en la temperatura","Más altura: más frío","Climas distintos en una misma zona"]},"en":{"title":"Landforms: height","cue":"Higher up, colder.","phrase":"In the mountains it is colder than on land at lower altitudes.","explain":"Even within the same climate zone, different heights can mean different climates. Mountains are colder than lower ground: the higher we climb, the lower the temperature usually is.","challenge":"Why can it be colder at the top of a mountain than at its foot?","answer":"Height affects temperature. Mountains are colder than lower ground, so different climates can exist within the same climate zone.","keyIdeas":["Height affects temperature","Higher up: colder","Different climates within one zone"]}},{"id":"sea","group":"factors","art":"relief","gl":{"title":"A distancia ao mar","cue":"Costa: temperaturas máis suaves.","phrase":"O mar suaviza as temperaturas: na costa son menos extremas ca no interior.","explain":"A distancia ao mar tamén inflúe no clima. As costas teñen temperaturas máis suaves, é dicir, menos extremas, ca as terras do interior. Por iso non abonda con mirar só a proximidade ao ecuador ou a altura.","challenge":"Compara as temperaturas da costa coas do interior. Que factor explica a diferenza?","answer":"As temperaturas da costa son máis suaves ca as do interior. A diferenza débese á influencia do mar: a distancia ao mar é un factor do clima.","keyIdeas":["Costa: temperaturas máis suaves","Interior: temperaturas máis extremas","Inflúe a distancia ao mar"]},"es":{"title":"La distancia al mar","cue":"Costa: temperaturas más suaves.","phrase":"El mar suaviza las temperaturas: en la costa son menos extremas que en el interior.","explain":"La distancia al mar también influye en el clima. Las costas tienen temperaturas más suaves, es decir, menos extremas, que las tierras del interior. Por eso no basta con mirar solo la proximidad al ecuador o la altura.","challenge":"Compara las temperaturas de la costa con las del interior. ¿Qué factor explica la diferencia?","answer":"Las temperaturas de la costa son más suaves que las del interior. La diferencia se debe a la influencia del mar: la distancia al mar es un factor del clima.","keyIdeas":["Costa: temperaturas más suaves","Interior: temperaturas más extremas","Influye la distancia al mar"]},"en":{"title":"Distance from the sea","cue":"Coast: milder temperatures.","phrase":"The sea keeps temperatures milder: on the coast they are less extreme than inland.","explain":"Distance from the sea also affects climate. Coastal temperatures are milder, meaning less extreme, than temperatures inland. This is why distance from the equator and height are not the only things to consider.","challenge":"Compare coastal and inland temperatures. What factor explains the difference?","answer":"Coastal temperatures are milder than temperatures inland. The sea causes this difference: distance from the sea is one factor that affects climate.","keyIdeas":["Coast: milder temperatures","Inland: more extreme temperatures","Distance from the sea matters"]}},{"id":"families","group":"base","art":"families","gl":{"title":"Tres grandes grupos","cue":"Cálidos. Temperados. Fríos.","phrase":"Hai tres grupos de climas; as temperaturas e as precipitacións explican a vexetación.","explain":"Hai tres grupos de climas: cálidos, temperados e fríos. Os cálidos sitúanse arredor do ecuador; os temperados, entre a zona cálida e as frías, teñen estacións diferenciadas. As temperaturas e as precipitacións dan lugar a vexetacións e paisaxes características.","challenge":"Nomea os tres grupos e explica como se relaciona o clima coa paisaxe.","answer":"Os tres grupos son os climas cálidos, temperados e fríos. As temperaturas e as precipitacións de cada clima fan que medre unha vexetación característica, que vemos nas paisaxes.","keyIdeas":["Cálidos, temperados e fríos","Temperaturas e precipitacións","Vexetación e paisaxes características"]},"es":{"title":"Tres grandes grupos","cue":"Cálidos. Templados. Fríos.","phrase":"Hay tres grupos de climas; las temperaturas y las precipitaciones explican la vegetación.","explain":"Hay tres grupos de climas: cálidos, templados y fríos. Los cálidos se sitúan alrededor del ecuador; los templados, entre la zona cálida y las frías, tienen estaciones diferenciadas. Las temperaturas y las precipitaciones dan lugar a vegetaciones y paisajes característicos.","challenge":"Nombra los tres grupos y explica cómo se relaciona el clima con el paisaje.","answer":"Los tres grupos son los climas cálidos, templados y fríos. Las temperaturas y las precipitaciones de cada clima hacen que crezca una vegetación característica, que vemos en los paisajes.","keyIdeas":["Cálidos, templados y fríos","Temperaturas y precipitaciones","Vegetación y paisajes característicos"]},"en":{"title":"Three main groups","cue":"Hot. Temperate. Cold.","phrase":"There are three climate groups; temperatures and precipitation shape the vegetation.","explain":"There are three climate groups: hot, temperate and cold. Hot climates are found around the equator. Temperate climates lie between the hot and cold zones and have distinct seasons. Temperatures and precipitation produce characteristic vegetation and landscapes.","challenge":"Name the three groups and explain how climate is linked to the landscape.","answer":"The three groups are hot, temperate and cold climates. The temperatures and precipitation of each climate allow characteristic vegetation to grow, which shapes the landscapes we see.","keyIdeas":["Hot, temperate and cold","Temperatures and precipitation","Characteristic vegetation and landscapes"]}},{"id":"equatorial","group":"warm","art":"equatorial","gl":{"title":"Clima ecuatorial","cue":"Calor. Moita choiva. Humidade. Selva.","phrase":"No clima ecuatorial vai calor, chove moito e medran selvas.","explain":"O clima ecuatorial é un clima cálido próximo ao ecuador. Vai calor e hai moita humidade porque chove moito. Estas condicións permiten que medre unha vexetación moi densa: a selva.","challenge":"Explica como é o clima ecuatorial e por que medran selvas.","answer":"O clima ecuatorial é cálido e está preto do ecuador. Vai calor, chove moito e hai moita humidade. Por iso medran selvas de vexetación moi densa.","keyIdeas":["Clima cálido, preto do ecuador","Moita choiva e humidade","Selvas"]},"es":{"title":"Clima ecuatorial","cue":"Calor. Mucha lluvia. Humedad. Selva.","phrase":"En el clima ecuatorial hace calor, llueve mucho y crecen selvas.","explain":"El clima ecuatorial es un clima cálido próximo al ecuador. Hace calor y hay mucha humedad porque llueve mucho. Estas condiciones permiten que crezca una vegetación muy densa: la selva.","challenge":"Explica cómo es el clima ecuatorial y por qué crecen selvas.","answer":"El clima ecuatorial es cálido y está cerca del ecuador. Hace calor, llueve mucho y hay mucha humedad. Por eso crecen selvas de vegetación muy densa.","keyIdeas":["Clima cálido, cerca del ecuador","Mucha lluvia y humedad","Selvas"]},"en":{"title":"Equatorial climate","cue":"Heat. Heavy rain. Humidity. Rainforest.","phrase":"In an equatorial climate it is hot, rain is plentiful and rainforests grow.","explain":"An equatorial climate is a hot climate near the equator. It is hot and very humid because it rains a lot. These conditions allow very dense vegetation to grow: rainforest.","challenge":"Describe an equatorial climate and explain why rainforests grow there.","answer":"An equatorial climate is hot and is found near the equator. There is lots of rain and humidity. This is why rainforests with very dense vegetation grow there.","keyIdeas":["Hot climate, near the equator","Lots of rain and humidity","Rainforests"]}},{"id":"tropical","group":"warm","art":"tropical","gl":{"title":"Clima tropical seco","cue":"Choiva nunha estación. Sabana.","phrase":"No tropical seco, as choivas concéntranse nunha estación e aparece a sabana.","explain":"O clima tropical seco é cálido. Ao afastarnos do ecuador, as choivas concéntranse nunha estación do ano. A vexetación é menos densa ca na selva; a súa paisaxe característica é a sabana.","challenge":"En que se diferencia o clima tropical seco do ecuatorial?","answer":"Os dous son climas cálidos. No tropical seco, as choivas concéntranse nunha estación e a vexetación é menos densa: a sabana. No ecuatorial chove moito e medran selvas.","keyIdeas":["Os dous son cálidos","Tropical seco: choiva nunha estación e sabana","Ecuatorial: moita choiva e selva"]},"es":{"title":"Clima tropical seco","cue":"Lluvia en una estación. Sabana.","phrase":"En el tropical seco, las lluvias se concentran en una estación y aparece la sabana.","explain":"El clima tropical seco es cálido. Al alejarnos del ecuador, las lluvias se concentran en una estación del año. La vegetación es menos densa que en la selva; su paisaje característico es la sabana.","challenge":"¿En qué se diferencia el clima tropical seco del ecuatorial?","answer":"Los dos son climas cálidos. En el tropical seco, las lluvias se concentran en una estación y la vegetación es menos densa: la sabana. En el ecuatorial llueve mucho y crecen selvas.","keyIdeas":["Los dos son cálidos","Tropical seco: lluvia en una estación y sabana","Ecuatorial: mucha lluvia y selva"]},"en":{"title":"Dry tropical climate","cue":"One rainy season. Savanna.","phrase":"In a dry tropical climate, rain falls mainly in one season and there is savanna.","explain":"Dry tropical climates are hot. Farther from the equator, rain is concentrated in one season of the year. Plants grow less densely than in the rainforest; the typical landscape is savanna.","challenge":"How does a dry tropical climate differ from an equatorial climate?","answer":"Both are hot climates. In a dry tropical climate, rain is concentrated in one season and the vegetation is less dense: savanna. In an equatorial climate, there is lots of rain and rainforests grow.","keyIdeas":["Both are hot","Dry tropical: one rainy season and savanna","Equatorial: lots of rain and rainforest"]}},{"id":"desert","group":"warm","art":"desert","gl":{"title":"Clima desértico","cue":"Case sen choiva. Poucas plantas.","phrase":"Nos desertos apenas chove; por iso medra moi pouca vexetación.","explain":"Nos desertos cálidos apenas chove. Como falta auga, medra moi pouca vexetación. Pode haber cactos e, nos lugares con auga, palmeiras. A escaseza de precipitacións é a idea principal para recoñecer este clima.","challenge":"Por que hai tan pouca vexetación nos desertos? Pon exemplos de plantas.","answer":"Nos desertos apenas chove e falta auga, por iso medra moi pouca vexetación. Pode haber cactos e, onde hai auga, palmeiras.","keyIdeas":["Precipitacións moi escasas","Falta auga e hai pouca vexetación","Cactos; palmeiras onde hai auga"]},"es":{"title":"Clima desértico","cue":"Casi sin lluvia. Pocas plantas.","phrase":"En los desiertos apenas llueve; por eso crece muy poca vegetación.","explain":"En los desiertos cálidos apenas llueve. Como falta agua, crece muy poca vegetación. Puede haber cactus y, en los lugares con agua, palmeras. La escasez de precipitaciones es la idea principal para reconocer este clima.","challenge":"¿Por qué hay tan poca vegetación en los desiertos? Pon ejemplos de plantas.","answer":"En los desiertos apenas llueve y falta agua, por eso crece muy poca vegetación. Puede haber cactus y, donde hay agua, palmeras.","keyIdeas":["Precipitaciones muy escasas","Falta agua y hay poca vegetación","Cactus; palmeras donde hay agua"]},"en":{"title":"Desert climate","cue":"Hardly any rain. Few plants.","phrase":"In deserts it hardly rains; this is why very little vegetation grows.","explain":"Hot deserts receive hardly any rain. Water is scarce, so very little vegetation grows. There may be cacti and, where there is water, palm trees. Very little precipitation is the key clue for this climate.","challenge":"Why is there so little vegetation in deserts? Give examples of plants.","answer":"In deserts there is hardly any rain and little water, so very little vegetation grows. There may be cacti and, where there is water, palm trees.","keyIdeas":["Very little precipitation","Little water and little vegetation","Cacti; palm trees where there is water"]}},{"id":"mediterranean","group":"temperate","art":"mediterranean","gl":{"title":"Clima mediterráneo","cue":"Pouca choiva. Verán quente.","phrase":"Chove pouco e vai calor no verán; o bosque adáptase á seca.","explain":"O mediterráneo é un clima temperado. Ten choivas escasas e temperaturas altas no verán. A súa vexetación característica é o bosque mediterráneo, con plantas adaptadas á seca, é dicir, a pasar períodos con pouca auga.","challenge":"Como son as temperaturas, as choivas e a vexetación do clima mediterráneo?","answer":"No clima mediterráneo, as choivas son escasas e as temperaturas son altas no verán. Hai bosque mediterráneo, adaptado á seca e á falta de auga.","keyIdeas":["Choivas escasas","Temperaturas altas no verán","Bosque mediterráneo adaptado á seca"]},"es":{"title":"Clima mediterráneo","cue":"Poca lluvia. Verano caluroso.","phrase":"Llueve poco y hace calor en verano; el bosque se adapta a la sequía.","explain":"El mediterráneo es un clima templado. Tiene lluvias escasas y temperaturas altas en verano. Su vegetación característica es el bosque mediterráneo, con plantas adaptadas a la sequía, es decir, a pasar períodos con poca agua.","challenge":"¿Cómo son las temperaturas, las lluvias y la vegetación del clima mediterráneo?","answer":"En el clima mediterráneo, las lluvias son escasas y las temperaturas son altas en verano. Hay bosque mediterráneo, adaptado a la sequía y a la falta de agua.","keyIdeas":["Lluvias escasas","Temperaturas altas en verano","Bosque mediterráneo adaptado a la sequía"]},"en":{"title":"Mediterranean climate","cue":"Little rain. Hot summer.","phrase":"Little rain and hot weather in summer; the woodland is adapted to drought.","explain":"The Mediterranean climate is temperate. It has little rain and high summer temperatures. Its typical vegetation is Mediterranean woodland, with plants adapted to drought: periods with little water.","challenge":"Describe the temperatures, rainfall and vegetation in a Mediterranean climate.","answer":"In a Mediterranean climate, there is little rain and temperatures are high in summer. Mediterranean woodland is adapted to drought and a lack of water.","keyIdeas":["Little rain","High summer temperatures","Mediterranean woodland adapted to drought"]}},{"id":"oceanic","group":"temperate","art":"oceanic","gl":{"title":"Clima oceánico","cue":"Choivas abundantes. Temperaturas suaves. Bosques, pradarías.","phrase":"No clima oceánico chove moito, as temperaturas son suaves e hai pradarías.","explain":"O oceánico é un clima temperado no que chove moito e as temperaturas son suaves. A auga favorece a vexetación: hai bosques e pradarías. Para recoñecelo, lembra as dúas pistas xuntas: choivas abundantes e temperaturas suaves.","challenge":"Describe o clima oceánico e compárao co mediterráneo.","answer":"No clima oceánico chove moito e as temperaturas son suaves; hai bosques e pradarías. No mediterráneo chove pouco, vai calor no verán e o bosque está adaptado á seca.","keyIdeas":["Oceánico: moita choiva e temperaturas suaves","Oceánico: bosques e pradarías","Mediterráneo: pouca choiva e verán quente"]},"es":{"title":"Clima oceánico","cue":"Lluvias abundantes. Temperaturas suaves. Bosques, praderas.","phrase":"En el clima oceánico llueve mucho, las temperaturas son suaves y hay praderas.","explain":"El oceánico es un clima templado en el que llueve mucho y las temperaturas son suaves. El agua favorece la vegetación: hay bosques y praderas. Para reconocerlo, recuerda las dos pistas juntas: lluvias abundantes y temperaturas suaves.","challenge":"Describe el clima oceánico y compáralo con el mediterráneo.","answer":"En el clima oceánico llueve mucho y las temperaturas son suaves; hay bosques y praderas. En el mediterráneo llueve poco, hace calor en verano y el bosque está adaptado a la sequía.","keyIdeas":["Oceánico: mucha lluvia y temperaturas suaves","Oceánico: bosques y praderas","Mediterráneo: poca lluvia y verano caluroso"]},"en":{"title":"Oceanic climate","cue":"Rainy. Mild. Forests and meadows.","phrase":"In an oceanic climate it rains a lot, temperatures are mild and there are meadows.","explain":"An oceanic climate is temperate, with plenty of rain and mild temperatures. Water helps plants grow: there are forests and meadows. Remember the two clues together: lots of rain and mild temperatures.","challenge":"Describe an oceanic climate and compare it with a Mediterranean climate.","answer":"In an oceanic climate, there is lots of rain and temperatures are mild; there are forests and meadows. In a Mediterranean climate, there is little rain, summers are hot and the woodland is adapted to drought.","keyIdeas":["Oceanic: lots of rain and mild temperatures","Oceanic: forests and meadows","Mediterranean: little rain and hot summers"]}},{"id":"continental","group":"temperate","art":"continental","gl":{"title":"Clima continental","cue":"Inverno frío. Verán cálido. Taiga, estepas.","phrase":"Invernos moi fríos; veráns cálidos con choivas. Hai bosques de taiga e estepas.","explain":"O continental é un clima temperado con grandes diferenzas entre estacións. Os invernos son moi fríos e os veráns son cálidos e con choivas. A súa vexetación inclúe bosques de taiga e estepas.","challenge":"Que diferenzas hai entre o inverno e o verán no clima continental? Que vexetación hai?","answer":"No clima continental, os invernos son moi fríos e os veráns son cálidos e con choivas. Hai bosques de taiga e estepas.","keyIdeas":["Invernos moi fríos","Veráns cálidos con choivas","Bosques de taiga e estepas"]},"es":{"title":"Clima continental","cue":"Invierno frío. Verano cálido. Taiga, estepas.","phrase":"Inviernos muy fríos; veranos cálidos con lluvias. Hay bosques de taiga y estepas.","explain":"El continental es un clima templado con grandes diferencias entre estaciones. Los inviernos son muy fríos y los veranos son cálidos y con lluvias. Su vegetación incluye bosques de taiga y estepas.","challenge":"¿Qué diferencias hay entre el invierno y el verano en el clima continental? ¿Qué vegetación hay?","answer":"En el clima continental, los inviernos son muy fríos y los veranos son cálidos y con lluvias. Hay bosques de taiga y estepas.","keyIdeas":["Inviernos muy fríos","Veranos cálidos con lluvias","Bosques de taiga y estepas"]},"en":{"title":"Continental climate","cue":"Cold winters. Warm summers. Taiga, steppes.","phrase":"Very cold winters; warm, rainy summers. There are taiga forests and steppes.","explain":"A continental climate is temperate, with big differences between the seasons. Winters are very cold, and summers are warm and rainy. Its vegetation includes taiga forests and steppes.","challenge":"How do winter and summer differ in a continental climate? What vegetation grows there?","answer":"In a continental climate, winters are very cold and summers are warm and rainy. There are taiga forests and steppes.","keyIdeas":["Very cold winters","Warm, rainy summers","Taiga forests and steppes"]}},{"id":"polar","group":"cold","art":"polar","gl":{"title":"Clima polar","cue":"Sempre moi frío. Pouca precipitación. Tundra.","phrase":"Preto dos polos vai moito frío, precipita pouco e pode haber tundra.","explain":"O clima polar dáse arredor dos polos Norte e Sur. Vai moito frío todo o ano. As precipitacións son escasas e adoitan ser en forma de neve. Apenas medra vexetación; onde é posible, hai tundra, con musgo e herbas.","challenge":"Onde está o clima polar? Explica as temperaturas, as precipitacións e a vexetación.","answer":"O clima polar está arredor dos polos Norte e Sur. Vai moito frío todo o ano e as precipitacións son escasas, normalmente de neve. Apenas hai vexetación; onde medra, hai tundra, con musgo e herbas.","keyIdeas":["Arredor dos polos: moito frío todo o ano","Pouca precipitación, normalmente neve","Vexetación escasa: tundra, musgo e herbas"]},"es":{"title":"Clima polar","cue":"Siempre mucho frío. Poca precipitación. Tundra.","phrase":"Cerca de los polos hace mucho frío, precipita poco y puede haber tundra.","explain":"El clima polar se da alrededor de los polos Norte y Sur. Hace mucho frío todo el año. Las precipitaciones son escasas y suelen ser en forma de nieve. Apenas crece vegetación; donde es posible, hay tundra, con musgo y hierbas.","challenge":"¿Dónde está el clima polar? Explica las temperaturas, las precipitaciones y la vegetación.","answer":"El clima polar está alrededor de los polos Norte y Sur. Hace mucho frío todo el año y las precipitaciones son escasas, normalmente de nieve. Apenas hay vegetación; donde crece, hay tundra, con musgo y hierbas.","keyIdeas":["Alrededor de los polos: mucho frío todo el año","Poca precipitación, normalmente nieve","Vegetación escasa: tundra, musgo y hierbas"]},"en":{"title":"Polar climate","cue":"Always very cold. Little precipitation. Tundra.","phrase":"Near the poles it is very cold, precipitation is scarce and there may be tundra.","explain":"Polar climates are found around the North and South Poles. It is very cold all year. There is little precipitation, usually snow. Very little vegetation grows; where it can grow, there is tundra, with mosses and grasses.","challenge":"Where are polar climates found? Describe the temperatures, precipitation and vegetation.","answer":"Polar climates are found around the North and South Poles. It is very cold all year, with little precipitation, usually snow. There is very little vegetation; where it grows, there is tundra, with mosses and grasses.","keyIdeas":["Around the poles: very cold all year","Little precipitation, usually snow","Little vegetation: tundra, mosses and grasses"]}},{"id":"mountain","group":"cold","art":"mountain","gl":{"title":"Clima de alta montaña","cue":"Altura. Frío. Precipitacións frecuentes.","phrase":"Nas altas montañas vai frío pola altura e as precipitacións son frecuentes.","explain":"O clima das altas montañas tamén é frío, pero ten precipitacións frecuentes. O frío explícase pola altura. Así, un lugar pode ter un clima frío por estar moi elevado, aínda que non estea preto dos polos.","challenge":"En que se parecen e en que se diferencian o clima polar e o de alta montaña?","answer":"Os dous son climas fríos. O polar está preto dos polos e ten precipitacións escasas. O de alta montaña é frío pola altura e ten precipitacións frecuentes.","keyIdeas":["Os dous son fríos","Polar: preto dos polos e pouca precipitación","Alta montaña: altura e precipitacións frecuentes"]},"es":{"title":"Clima de alta montaña","cue":"Altura. Frío. Precipitaciones frecuentes.","phrase":"En las altas montañas hace frío por la altura y las precipitaciones son frecuentes.","explain":"El clima de las altas montañas también es frío, pero tiene precipitaciones frecuentes. El frío se explica por la altura. Así, un lugar puede tener un clima frío por estar muy elevado, aunque no esté cerca de los polos.","challenge":"¿En qué se parecen y en qué se diferencian el clima polar y el de alta montaña?","answer":"Los dos son climas fríos. El polar está cerca de los polos y tiene precipitaciones escasas. El de alta montaña es frío por la altura y tiene precipitaciones frecuentes.","keyIdeas":["Los dos son fríos","Polar: cerca de los polos y poca precipitación","Alta montaña: altura y precipitaciones frecuentes"]},"en":{"title":"High mountain climate","cue":"Height. Cold. Frequent precipitation.","phrase":"In high mountains it is cold because of the height and precipitation is frequent.","explain":"The climate high in the mountains is also cold, but precipitation is frequent. The cold is due to the height. A place can therefore have a cold climate because it is high up, even if it is far from the poles.","challenge":"How are polar and high mountain climates alike, and how are they different?","answer":"Both are cold climates. Polar climates are near the poles and have little precipitation. High mountain climates are cold because of their height and have frequent precipitation.","keyIdeas":["Both are cold","Polar: near the poles, little precipitation","High mountain: height and frequent precipitation"]}}]};

":"¿En qué unidad expresamos la temperatura en esta lección?","options":["Grados Celsius","Kilómetros","Kilogramos","Litros"],"explain":"Los grados Celsius se representan con °C."},"correct":0,"en":{"q":"Which unit do we use for temperature in this lesson?","options":["Degrees Celsius","Kilometres","Kilograms","Litres"],"explain":"We write degrees Celsius as °C."}},{"id":"c06","topic":"precipitation","art":"rain","gl":{"q":"Con que medimos as precipitacións?","options":["Termómetro","Reloxo","Balanza","Pluviómetro"],"explain":"O pluviómetro permite medir a cantidade de precipitación."},"es":{"q":"¿Con qué medimos las precipitaciones?","options":["Termómetro","Reloj","Balanza","Pluviómetro"],"explain":"El pluviómetro permite medir la cantidad de precipitación."},"correct":3,"en":{"q":"What do we use to measure precipitation?","options":["A thermometer","A clock","Scales","A rain gauge"],"explain":"A rain gauge measures the amount of precipitation."}},{"id":"c07","topic":"precipitation","art":"rain","gl":{"q":"Cal destes grupos contén só formas de precipitación?","options":["Choiva, vento e calor","Frío, vento e neve","Choiva, neve e sarabia","Calor, neve e sarabia"],"explain":"A auga pode caer como choiva, neve ou sarabia."},"es":{"q":"¿Cuál de estos grupos contiene solo formas de precipitación?","options":["Lluvia, viento y calor","Frío, viento y nieve","Lluvia, nieve y granizo","Calor, nieve y granizo"],"explain":"El agua puede caer como lluvia, nieve o granizo."},"correct":2,"en":{"q":"Which group contains only forms of precipitation?","options":["Rain, wind and heat","Cold, wind and snow","Rain, snow and hail","Heat, snow and hail"],"explain":"Water can fall as rain, snow or hail."}},{"id":"c08","topic":"precipitation","art":"rain","gl":{"q":"Se recollemos a auga caída durante o día, que estamos medindo?","options":["A distancia ao mar","A precipitación","A temperatura","A altura"],"explain":"A precipitación é a auga que cae da atmosfera."},"es":{"q":"Si recogemos el agua caída durante el día, ¿qué estamos midiendo?","options":["La distancia al mar","La precipitación","La temperatura","La altura"],"explain":"La precipitación es el agua que cae de la atmósfera."},"correct":1,"en":{"q":"If we collect the water that falls during the day, what are we measuring?","options":["Distance from the sea","Precipitation","Temperature","Height"],"explain":"Precipitation is water that falls from the atmosphere."}},{"id":"c11","topic":"zones","art":"zones","gl":{"q":"Cantas zonas cálidas hai no esquema da Terra?","options":["Tres","Cinco","Unha","Dúas"],"explain":"Hai unha zona cálida arredor do ecuador."},"es":{"q":"¿Cuántas zonas cálidas hay en el esquema de la Tierra?","options":["Tres","Cinco","Una","Dos"],"explain":"Hay una zona cálida alrededor del ecuador."},"correct":2,"en":{"q":"How many hot zones are there in the diagram of Earth?","options":["Three","Five","One","Two"],"explain":"There is one hot zone around the equator."}},{"id":"c12","topic":"zones","art":"zones","gl":{"q":"Cal é a distribución das cinco zonas climáticas?","options":["1 cálida, 1 temperada e 3 frías","1 cálida, 2 temperadas e 2 frías","2 cálidas, 1 temperada e 2 frías","2 cálidas, 2 temperadas e 1 fría"],"explain":"Unha zona central cálida, dúas temperadas e dúas frías."},"es":{"q":"¿Cuál es la distribución de las cinco zonas climáticas?","options":["1 cálida, 1 templada y 3 frías","1 cálida, 2 templadas y 2 frías","2 cálidas, 1 templada y 2 frías","2 cálidas, 2 templadas y 1 fría"],"explain":"Una zona central cálida, dos templadas y dos frías."},"correct":1,"en":{"q":"How are the five climate zones divided?","options":["1 hot, 1 temperate and 3 cold","1 hot, 2 temperate and 2 cold","2 hot, 1 temperate and 2 cold","2 hot, 2 temperate and 1 cold"],"explain":"There is one central hot zone, two temperate zones and two cold zones."}},{"id":"c13","topic":"relief","art":"relief","gl":{"q":"Na mesma rexión, onde adoita ir máis frío?","options":["No alto da montaña","Ao pé da montaña","Na terra máis baixa","Á mesma temperatura sempre"],"explain":"Nas montañas vai máis frío ca nas terras de menos altura."},"es":{"q":"En la misma región, ¿dónde suele hacer más frío?","options":["En lo alto de la montaña","Al pie de la montaña","En la tierra más baja","A la misma temperatura siempre"],"explain":"En las montañas hace más frío que en las tierras de menor altura."},"correct":0,"en":{"q":"In the same region, where is it usually colder?","options":["At the top of a mountain","At the foot of a mountain","On lower land","It is always the same temperature"],"explain":"Mountains are colder than lower land."}},{"id":"c14","topic":"sea","art":"relief","gl":{"q":"En xeral, onde son máis suaves as temperaturas?","options":["No interior afastado","Nos cumes máis altos","En todas partes igual","Na costa"],"explain":"O mar suaviza as temperaturas das costas."},"es":{"q":"En general, ¿dónde son más suaves las temperaturas?","options":["En el interior alejado","En las cumbres más altas","En todas partes igual","En la costa"],"explain":"El mar suaviza las temperaturas de las costas."},"correct":3,"en":{"q":"In general, where are temperatures milder?","options":["Far inland","On the highest peaks","They are the same everywhere","On the coast"],"explain":"The sea makes coastal temperatures milder."}},{"id":"c15","topic":"families","art":"families","gl":{"q":"Cales son os tres grandes grupos de climas?","options":["Montañas, costas e chairas","Primavera, verán e inverno","Cálidos, temperados e fríos","Selvas, sabanas e desertos"],"explain":"A lección clasifica os climas en cálidos, temperados e fríos."},"es":{"q":"¿Cuáles son los tres grandes grupos de climas?","options":["Montañas, costas y llanuras","Primavera, verano e invierno","Cálidos, templados y fríos","Selvas, sabanas y desiertos"],"explain":"La lección clasifica los climas en cálidos, templados y fríos."},"correct":2,"en":{"q":"What are the three main groups of climates?","options":["Mountains, coasts and plains","Spring, summer and winter","Hot, temperate and cold","Rainforests, savannas and deserts"],"explain":"The lesson groups climates into hot, temperate and cold climates."}},{"id":"c17","topic":"equatorial","art":"equatorial","gl":{"q":"Cal destas paisaxes corresponde ao clima ecuatorial?","options":["Selva","Tundra","Estepa","Deserto"],"explain":"Coa calor e a choiva abundante medran selvas."},"es":{"q":"¿Cuál de estos paisajes corresponde al clima ecuatorial?","options":["Selva","Tundra","Estepa","Desierto"],"explain":"Con el calor y la lluvia abundante crecen selvas."},"correct":0,"en":{"q":"Which landscape belongs to the equatorial climate?","options":["Rainforest","Tundra","Steppe","Desert"],"explain":"Heat and plenty of rain allow rainforests to grow."}},{"id":"c18","topic":"equatorial","art":"equatorial","gl":{"q":"Como é o clima ecuatorial?","options":["Frío e moi seco","Cálido e case sen choiva","Frío e con pouca vexetación","Cálido e moi húmido"],"explain":"Vai calor e hai moita humidade porque chove moito."},"es":{"q":"¿Cómo es el clima ecuatorial?","options":["Frío y muy seco","Cálido y casi sin lluvia","Frío y con poca vegetación","Cálido y muy húmedo"],"explain":"Hace calor y hay mucha humedad porque llueve mucho."},"correct":3,"en":{"q":"What is the equatorial climate like?","options":["Cold and very dry","Hot with almost no rain","Cold with little vegetation","Hot and very humid"],"explain":"It is hot and very humid because it rains a lot."}},{"id":"c19","topic":"equatorial","art":"equatorial","gl":{"q":"En que grupo está o clima ecuatorial?","options":["Fríos","De alta montaña","Cálidos","Temperados"],"explain":"O ecuatorial é un dos climas cálidos da lección."},"es":{"q":"¿En qué grupo está el clima ecuatorial?","options":["Fríos","De alta montaña","Cálidos","Templados"],"explain":"El ecuatorial es uno de los climas cálidos de la lección."},"correct":2,"en":{"q":"Which group does the equatorial climate belong to?","options":["Cold climates","High mountain climates","Hot climates","Temperate climates"],"explain":"The equatorial climate is one of the hot climates in this lesson."}},{"id":"c20","topic":"tropical","art":"tropical","gl":{"q":"Que paisaxe aparece no clima tropical seco?","options":["Taiga","Sabana","Selva","Tundra"],"explain":"A vexetación é menos densa ca na selva: aparece a sabana."},"es":{"q":"¿Qué paisaje aparece en el clima tropical seco?","options":["Taiga","Sabana","Selva","Tundra"],"explain":"La vegetación es menos densa que en la selva: aparece la sabana."},"correct":1,"en":{"q":"Which landscape is found in the dry tropical climate?","options":["Taiga","Savanna","Rainforest","Tundra"],"explain":"Vegetation is less dense than in the rainforest: savannas are found here."}},{"id":"c21","topic":"tropical","art":"tropical","gl":{"q":"No clima tropical seco, as choivas concéntranse…","options":["Nunha estación","En todos os meses por igual","Só en forma de neve","En ningún momento do ano"],"explain":"Hai unha estación de choivas e outra seca."},"es":{"q":"En el clima tropical seco, las lluvias se concentran…","options":["En una estación","En todos los meses por igual","Solo en forma de nieve","En ningún momento del año"],"explain":"Hay una estación de lluvias y otra seca."},"correct":0,"en":{"q":"In the dry tropical climate, rain is concentrated…","options":["In one season","Equally in every month","Only in the form of snow","At no time of the year"],"explain":"There is a rainy season and a dry season."}},{"id":"c23","topic":"desert","art":"desert","gl":{"q":"Como son as choivas no clima desértico?","options":["Diarias","Só de sarabia","Moi escasas","Moi abundantes"],"explain":"Nos desertos apenas chove."},"es":{"q":"¿Cómo son las lluvias en el clima desértico?","options":["Diarias","Solo de granizo","Muy escasas","Muy abundantes"],"explain":"En los desiertos apenas llueve."},"correct":2,"en":{"q":"How much rain falls in the desert climate?","options":["It rains every day","Only hail falls","Very little","A great deal"],"explain":"It hardly ever rains in deserts."}},{"id":"c25","topic":"desert","art":"desert","gl":{"q":"Que explica a escasa vexetación do clima desértico?","options":["A falta de choiva","A choiva diaria","A neve abundante","A humidade moi alta"],"explain":"A pouca auga dificulta o crecemento da vexetación."},"es":{"q":"¿Qué explica la escasa vegetación del clima desértico?","options":["La falta de lluvia","La lluvia diaria","La nieve abundante","La humedad muy alta"],"explain":"La poca agua dificulta el crecimiento de la vegetación."},"correct":0,"en":{"q":"Why does so little vegetation grow in the desert climate?","options":["The lack of rain","Daily rain","Lots of snow","Very high humidity"],"explain":"A lack of water makes it hard for vegetation to grow."}},{"id":"c28","topic":"mediterranean","art":"mediterranean","gl":{"q":"Como son os veráns do clima mediterráneo?","options":["Moi fríos e con neve","Calorosos e secos","Moi fríos e secos","Suaves e moi chuviosos"],"explain":"No verán as temperaturas son altas e escasean as choivas."},"es":{"q":"¿Cómo son los veranos del clima mediterráneo?","options":["Muy fríos y con nieve","Calurosos y secos","Muy fríos y secos","Suaves y muy lluviosos"],"explain":"En verano las temperaturas son altas y escasean las lluvias."},"correct":1,"en":{"q":"What are summers like in the Mediterranean climate?","options":["Very cold and snowy","Hot and dry","Very cold and dry","Mild and very rainy"],"explain":"Summer temperatures are high and there is little rain."}},{"id":"c30","topic":"mediterranean","art":"mediterranean","gl":{"q":"En que grupo está o clima mediterráneo?","options":["Cálidos","Fríos","Polares","Temperados"],"explain":"É temperado, xunto co oceánico e co continental."},"es":{"q":"¿En qué grupo está el clima mediterráneo?","options":["Cálidos","Fríos","Polares","Templados"],"explain":"Es templado, junto con el oceánico y el continental."},"correct":3,"en":{"q":"Which group do
