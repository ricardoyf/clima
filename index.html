r the poles”.","chunks":["Near the poles","it is very cold,","precipitation is scarce","and there may be tundra."],"explain":"Near the poles it is very cold, precipitation is scarce and there may be tundra."}},{"id":"b20","topic":"mountain","art":"mountain","gl":{"q":"Ordena a frase. Comeza por «Nas altas montañas».","chunks":["Nas altas montañas","vai frío pola altura","e as precipitacións","son frecuentes."],"explain":"Nas altas montañas vai frío pola altura e as precipitacións son frecuentes."},"es":{"q":"Ordena la frase. Empieza por «En las altas montañas».","chunks":["En las altas montañas","hace frío por la altura","y las precipitaciones","son frecuentes."],"explain":"En las altas montañas hace frío por la altura y las precipitaciones son frecuentes."},"en":{"q":"Put the sentence in order. Start with “In high mountains”.","chunks":["In high mountains","it is cold because of the height","and precipitation","is frequent."],"explain":"In high mountains it is cold because of the height and precipitation is frequent."}}],"recall":[{"id":"r01","topic":"climate","art":"globe","gl":{"q":"Aproximadamente cantos anos se estudan para coñecer un clima?","answer":"30 anos","accepted":["30 anos","30","trinta","trinta anos","uns 30 anos","uns trinta anos"],"hint":"Son tres décadas.","explain":"Estúdanse as condicións ao longo duns trinta anos."},"es":{"q":"¿Aproximadamente cuántos años se estudian para conocer un clima?","answer":"30 años","accepted":["30 años","30","treinta","treinta años","unos 30 años","unos treinta años"],"hint":"Son tres décadas.","explain":"Se estudian las condiciones a lo largo de unos treinta años."}},{"id":"r02","topic":"temperature","art":"thermometer","gl":{"q":"Que instrumento mide a temperatura?","answer":"Termómetro","accepted":["Termómetro","o termómetro","un termómetro"],"hint":"Pensa no instrumento que mostra graos.","explain":"O termómetro indica a temperatura."},"es":{"q":"¿Qué instrumento mide la temperatura?","answer":"Termómetro","accepted":["Termómetro","el termómetro","un termómetro"],"hint":"Piensa en el instrumento que muestra grados.","explain":"El termómetro indica la temperatura."}},{"id":"r03","topic":"temperature","art":"thermometer","gl":{"q":"Como se chaman os graos representados con °C?","answer":"Graos Celsius","accepted":["Graos Celsius","Celsius","graos centígrados","centígrados"],"hint":"O nome comeza por C.","explain":"Nesta lección expresamos a temperatura en graos Celsius."},"es":{"q":"¿Cómo se llaman los grados representados con °C?","answer":"Grados Celsius","accepted":["Grados Celsius","Celsius","grados centígrados","centígrados"],"hint":"El nombre empieza por C.","explain":"En esta lección expresamos la temperatura en grados Celsius."}},{"id":"r04","topic":"precipitation","art":"rain","gl":{"q":"Que instrumento mide a cantidade de precipitación?","answer":"Pluviómetro","accepted":["Pluviómetro","o pluviómetro","un pluviómetro"],"hint":"O seu nome empeza por «plu».","explain":"O pluviómetro recolle a auga caída e permite medila."},"es":{"q":"¿Qué instrumento mide la cantidad de precipitación?","answer":"Pluviómetro","accepted":["Pluviómetro","el pluviómetro","un pluviómetro"],"hint":"Su nombre empieza por «plu».","explain":"El pluviómetro recoge el agua caída y permite medirla."}},{"id":"r05","topic":"precipitation","art":"rain","gl":{"q":"Ademais da choiva e da neve, que forma de precipitación cita a lección?","answer":"Sarabia","accepted":["Sarabia","a sarabia","pedra","a pedra"],"hint":"Son pequenas bólas de xeo.","explain":"A sarabia tamén é unha forma de precipitación."},"es":{"q":"Además de la lluvia y la nieve, ¿qué forma de precipitación cita la lección?","answer":"Granizo","accepted":["Granizo","el granizo"],"hint":"Son pequeñas bolas de hielo.","explain":"El granizo también es una forma de precipitación."}},{"id":"r06","topic":"zones","art":"zones","gl":{"q":"Preto de que liña imaxinaria chegan os raios solares máis perpendiculares?","answer":"Ecuador","accepted":["Ecuador","o ecuador","do ecuador"],"hint":"Está a igual distancia dos dous polos.","explain":"Preto do ecuador os raios quentan máis."},"es":{"q":"¿Cerca de qué línea imaginaria llegan los rayos solares más perpendiculares?","answer":"Ecuador","accepted":["Ecuador","el ecuador","del ecuador"],"hint":"Está a igual distancia de los dos polos.","explain":"Cerca del ecuador los rayos calientan más."}},{"id":"r07","topic":"zones","art":"zones","gl":{"q":"Cantas zonas temperadas hai na Terra?","answer":"Dúas","accepted":["Dúas","2","dúas zonas","2 zonas"],"hint":"Hai unha a cada lado da zona cálida.","explain":"Hai dúas zonas temperadas."},"es":{"q":"¿Cuántas zonas templadas hay en la Tierra?","answer":"Dos","accepted":["Dos","2","dos zonas","2 zonas"],"hint":"Hay una a cada lado de la zona cálida.","explain":"Hay dos zonas templadas."}},{"id":"r08","topic":"zones","art":"zones","gl":{"q":"Cantas zonas frías hai na Terra?","answer":"Dúas","accepted":["Dúas","2","dúas zonas","2 zonas"],"hint":"Pensa nos dous extremos da Terra.","explain":"Hai unha zona fría arredor de cada polo."},"es":{"q":"¿Cuántas zonas frías hay en la Tierra?","answer":"Dos","accepted":["Dos","2","dos zonas","2 zonas"],"hint":"Piensa en los dos extremos de la Tierra.","explain":"Hay una zona fría alrededor de cada polo."}},{"id":"r09","topic":"relief","art":"relief","gl":{"q":"Se subimos unha montaña, en xeral a temperatura sobe ou baixa?","answer":"Baixa","accepted":["Baixa","descende","diminúe","baixa a temperatura"],"hint":"Nos cumes adoita ir máis frío.","explain":"A maior altura, normalmente vai máis frío."},"es":{"q":"Si subimos una montaña, en general, ¿la temperatura sube o baja?","answer":"Baja","accepted":["Baja","desciende","disminuye","baja la temperatura"],"hint":"En las cumbres suele hacer más frío.","explain":"A mayor altura, normalmente hace más frío."}},{"id":"r10","topic":"sea","art":"relief","gl":{"q":"Na costa, o mar fai que as temperaturas sexan máis…","answer":"Suaves","accepted":["Suaves","suave","moderadas"],"hint":"Hai menos extremos de calor e frío.","explain":"O mar suaviza as temperaturas das costas."},"es":{"q":"En la costa, el mar hace que las temperaturas sean más…","answer":"Suaves","accepted":["Suaves","suave","moderadas"],"hint":"Hay menos extremos de calor y frío.","explain":"El mar suaviza las temperaturas de las costas."}},{"id":"r11","topic":"families","art":"families","gl":{"q":"Completa os grupos: cálidos, temperados e…","answer":"Fríos","accepted":["Fríos","climas fríos","os fríos"],"hint":"É o grupo no que está o polar.","explain":"Os tres grupos son cálidos, temperados e fríos."},"es":{"q":"Completa los grupos: cálidos, templados y…","answer":"Fríos","accepted":["Fríos","climas fríos","los fríos"],"hint":"Es el grupo en el que está el polar.","explain":"Los tres grupos son cálidos, templados y fríos."}},{"id":"r12","topic":"equatorial","art":"equatorial","gl":{"q":"Que vexetación característica medra no clima ecuatorial?","answer":"Selva","accepted":["Selva","a selva","selvas","as selvas","unha selva"],"hint":"É un bosque moi denso con moita humidade.","explain":"Calor e choivas abundantes favorecen a selva."},"es":{"q":"¿Qué vegetación característica crece en el clima ecuatorial?","answer":"Selva","accepted":["Selva","la selva","selvas","las selvas","una selva"],"hint":"Es un bosque muy denso con mucha humedad.","explain":"Calor y lluvias abundantes favorecen la selva."}},{"id":"r13","topic":"equatorial","art":"equatorial","gl":{"q":"Que clima cálido ten moita calor, humidade e selvas?","answer":"Ecuatorial","accepted":["Ecuatorial","clima ecuatorial","o ecuatorial"],"hint":"O seu nome lembra unha liña imaxinaria da Terra.","explain":"É o clima ecuatorial, cálido e moi húmido."},"es":{"q":"¿Qué clima cálido tiene mucho calor, humedad y selvas?","answer":"Ecuatorial","accepted":["Ecuatorial","clima ecuatorial","el ecuatorial"],"hint":"Su nombre recuerda una línea imaginaria de la Tierra.","explain":"Es el clima ecuatorial, cálido y muy húmedo."}},{"id":"r14","topic":"tropical","art":"tropical","gl":{"q":"Que paisaxe corresponde ao clima tropical seco?","answer":"Sabana","accepted":["Sabana","a sabana","sabanas","unha sabana"],"hint":"Ten vexetación menos densa ca a selva.","explain":"A sabana aparece onde as choivas se concentran nunha estación."},"es":{"q":"¿Qué paisaje corresponde al clima tropical seco?","answer":"Sabana","accepted":["Sabana","la sabana","sabanas","una sabana"],"hint":"Tiene vegetación menos densa que la selva.","explain":"La sabana aparece donde las lluvias se concentran en una estación."}},{"id":"r15","topic":"tropical","art":"tropical","gl":{"q":"En cantas estacións se concentran as choivas do tropical seco?","answer":"Nunha","accepted":["Nunha","1","unha","unha estación","nunha estación","1 estación"],"hint":"Non chove por igual durante todo o ano.","explain":"A lección indica unha estación de choivas."},"es":{"q":"¿En cuántas estaciones se concentran las lluvias del tropical seco?","answer":"En una","accepted":["En una","1","una","una estación","en una estación","1 estación"],"hint":"No llueve por igual durante todo el año.","explain":"La lección indica una estación de lluvias."}},{"id":"r16","topic":"desert","art":"desert","gl":{"q":"Que clima cálido da lección ten moi pouca vexetación porque apenas chove?","answer":"Desértico","accepted":["Desértico","clima desértico","o desértico","deserto"],"hint":"Pensa nas dunas e nos cactos do debuxo do libro.","explain":"No clima desértico as precipitacións son moi escasas."},"es":{"q":"¿Qué clima cálido de la lección tiene muy poca vegetación porque apenas llueve?","answer":"Desértico","accepted":["Desértico","clima desértico","el desértico","desierto"],"hint":"Piensa en las dunas y los cactus del dibujo del libro.","explain":"En el clima desértico las precipitaciones son muy escasas."}},{"id":"r17","topic":"mediterranean","art":"mediterranean","gl":{"q":"A que se adapta o bosque mediterráneo?","answer":"Á seca","accepted":["Á seca","seca","a seca","á falta de auga","falta de auga","escaseza de auga"],"hint":"Ten que soportar a escaseza de auga.","explain":"O bosque mediterráneo está adaptado á seca."},"es":{"q":"¿A qué se adapta el bosque mediterráneo?","answer":"A la sequía","accepted":["A la sequía","sequía","la sequía","a la falta de agua","falta de agua","escasez de agua"],"hint":"Tiene que soportar la escasez de agua.","explain":"El bosque mediterráneo está adaptado a la sequía."}},{"id":"r18","topic":"mediterranean","art":"mediterranean","gl":{"q":"Que clima temperado ten veráns calorosos e secos?","answer":"Mediterráneo","accepted":["Mediterráneo","clima mediterráneo","o mediterráneo"],"hint":"O seu nome coincide co dun mar.","explain":"O mediterráneo ten choivas escasas e temperaturas altas no verán."},"es":{"q":"¿Qué clima templado tiene veranos calurosos y secos?","answer":"Mediterráneo","accepted":["Mediterráneo","clima mediterráneo","el mediterráneo"],"hint":"Su nombre coincide con el de un mar.","explain":"El mediterráneo tiene lluvias escasas y temperaturas altas en verano."}},{"id":"r19","topic":"oceanic","art":"oceanic","gl":{"q":"Que clima temperado ten moita choiva e temperaturas suaves?","answer":"Oceánico","accepted":["Oceánico","clima oceánico","o oceánico"],"hint":"O seu nome lembra os océanos.","explain":"No clima oceánico hai bosques e pradarías."},"es":{"q":"¿Qué clima templado tiene mucha lluvia y temperaturas suaves?","answer":"Oceánico","accepted":["Oceánico","clima oceánico","el oceánico"],"hint":"Su nombre recuerda los océanos.","explain":"En el clima oceánico hay bosques y praderas."}},{"id":"r20","topic":"oceanic","art":"oceanic","gl":{"q":"Completa a vexetación oceánica: bosques e…","answer":"Pradarías","accepted":["Pradarías","as pradarías","prados","pradería","pradeiras"],"hint":"Son extensións cubertas de herba.","explain":"Bosques e pradarías son característicos do clima oceánico."},"es":{"q":"Completa la vegetación oceánica: bosques y…","answer":"Praderas","accepted":["Praderas","las praderas","prados","pradera"],"hint":"Son extensiones cubiertas de hierba.","explain":"Bosques y praderas son característicos del clima oceánico."}},{"id":"r21","topic":"continental","art":"continental","gl":{"q":"Que clima temperado ten invernos moi fríos e veráns cálidos con choivas?","answer":"Continental","accepted":["Continental","clima continental","o continental"],"hint":"O seu nome lembra as grandes masas de terra.","explain":"No clima continental hai gran contraste entre inverno e verán."},"es":{"q":"¿Qué clima templado tiene inviernos muy fríos y veranos cálidos con lluvias?","answer":"Continental","accepted":["Continental","clima continental","el continental"],"hint":"Su nombre recuerda las grandes masas de tierra.","explain":"En el clima continental hay gran contraste entre invierno y verano."}},{"id":"r22","topic":"continental","art":"continental","gl":{"q":"Completa as paisaxes do clima continental: taiga e…","answer":"Estepas","accepted":["Estepas","as estepas","estepa"],"hint":"A palabra comeza por «es».","explain":"A lección asocia o clima continental coa taiga e coas estepas."},"es":{"q":"Completa los paisajes del clima continental: taiga y…","answer":"Estepas","accepted":["Estepas","las estepas","estepa"],"hint":"La palabra empieza por «es».","explain":"La lección asocia el clima continental con la taiga y las estepas."}},{"id":"r23","topic":"polar","art":"polar","gl":{"q":"Como se chama a vexetación polar con musgos e herbas?","answer":"Tundra","accepted":["Tundra","a tundra"],"hint":"O nome empeza por «tun».","explain":"A tundra ten vexetación baixa, como musgos e herbas."},"es":{"q":"¿Cómo se llama la vegetación polar con musgos y hierbas?","answer":"Tundra","accepted":["Tundra","la tundra"],"hint":"El nombre empieza por «tun».","explain":"La tundra tiene vegetación baja, como musgos y hierbas."}},{"id":"r24","topic":"mountain","art":"mountain","gl":{"q":"Que clima frío ten precipitacións frecuentes: polar ou alta montaña?","answer":"Alta montaña","accepted":["Alta montaña","de alta montaña","clima de alta montaña","montaña","o de alta montaña"],"hint":"Pensa na diferenza entre os dous climas fríos da lección.","explain":"A alta montaña ten precipitacións frecuentes; o polar, escasas."},"es":{"q":"¿Qué clima frío tiene precipitaciones frecuentes: polar o alta montaña?","answer":"Alta montaña","accepted":["Alta montaña","de alta montaña","clima de alta montaña","montaña","el de alta montaña"],"hint":"Piensa en la diferencia entre los dos climas fríos de la lección.","explain":"La alta montaña tiene precipitaciones frecuentes; el polar, escasas."}}],"connect":[{"id":"x01","topic":"climate","art":"globe","gl":{"q":"Hoxe choveu. Podemos dicir xa como é o clima? Explica que datos necesitamos.","answer":"Un día de choiva non permite coñecer o clima dun lugar. Necesitamos estudar as temperaturas e as precipitacións ao longo duns trinta anos e observar como se distribúen nas estacións.","keyIdeas":["Un día non basta","Temperaturas e precipitacións","Uns 30 anos; distribución nas estacións"]},"es":{"q":"Hoy ha llovido. ¿Podemos decir ya cómo es el clima? Explica qué datos necesitamos.","answer":"Un día de lluvia no permite conocer el clima de un lugar. Necesitamos estudiar las temperaturas y las precipitaciones a lo largo de unos treinta años y observar cómo se distribuyen en las estaciones.","keyIdeas":["Un día no basta","Temperaturas y precipitaciones","Unos 30 años; distribución en las estaciones"]},"en":{"q":"It rained today. Can we already describe the climate? Explain what information we need.","answer":"One rainy day cannot tell us a place's climate. We need to study temperatures and precipitation over about thirty years and see how they vary across the seasons.","keyIdeas":["One day is not enough","Temperatures and precipitation","About 30 years; patterns across the seasons"]}},{"id":"x02","topic":"temperature","art":"thermometer","gl":{"q":"Tes un termómetro e un pluviómetro. Explica que mide cada un e como os usarías para estudar un clima.","answer":"O termómetro mide a temperatura, expresada en graos Celsius. O pluviómetro mide a cantidade de precipitación. Rexistrando os datos durante moitos anos podemos coñecer as temperaturas e as precipitacións de cada estación.","keyIdeas":["Termómetro: temperatura en °C","Pluviómetro: precipitación","Datos durante moitos anos"]},"es":{"q":"Tienes un termómetro y un pluviómetro. Explica qué mide cada uno y cómo los usarías para estudiar un clima.","answer":"El termómetro mide la temperatura, expresada en grados Celsius. El pluviómetro mide la cantidad de precipitación. Registrando los datos durante muchos años podemos conocer las temperaturas y las precipitaciones de cada estación.","keyIdeas":["Termómetro: temperatura en °C","Pluviómetro: precipitación","Datos durante muchos años"]},"en":{"q":"You have a thermometer and a rain gauge. Explain what each measures and how you would use them to study a climate.","answer":"A thermometer measures temperature, expressed in degrees Celsius. A rain gauge measures the amount of precipitation. By recording data over many years, we can learn about each season's temperatures and precipitation.","keyIdeas":["Thermometer: temperature in °C","Rain gauge: precipitation","Data collected over many years"]}},{"id":"x03","topic":"zones","art":"zones","gl":{"q":"Por que a zona cálida está preto do ecuador e as frías preto dos polos?","answer":"Preto do ecuador os raios solares chegan máis perpendiculares e quentan máis. Ao afastarnos del, as temperaturas van descendendo. Por iso hai unha zona cálida central, dúas temperadas e dúas frías preto dos polos.","keyIdeas":["Raios máis perpendiculares no ecuador","Temperaturas menores cara aos polos","Unha cálida, dúas temperadas e dúas frías"]},"es":{"q":"¿Por qué la zona cálida está cerca del ecuador y las frías cerca de los polos?","answer":"Cerca del ecuador los rayos solares llegan más perpendiculares y calientan más. Al alejarnos de él, las temperaturas van descendiendo. Por eso hay una zona cálida central, dos templadas y dos frías cerca de los polos.","keyIdeas":["Rayos más perpendiculares en el ecuador","Temperaturas menores hacia los polos","Una cálida, dos templadas y dos frías"]},"en":{"q":"Why is the hot zone near the equator and the cold zones near the poles?","answer":"Near the equator, the Sun's rays reach Earth more directly and provide more heat. Temperatures fall as we move away from the equator. This gives us one central hot zone, two temperate zones and two cold zones near the poles.","keyIdeas":["The Sun's rays reach the equator more directly","Temperatures fall towards the poles","One hot, two temperate and two cold zones"]}},{"id":"x04","topic":"families","art":"families","gl":{"q":"A lección fala de tres grupos de climas e de cinco zonas. Como poden ser certas as dúas cousas?","answer":"Os tres grupos son os climas cálidos, temperados e fríos. As zonas son cinco porque hai unha cálida, dúas temperadas e dúas frías. Hai unha zona temperada e unha fría a cada lado da zona cálida.","keyIdeas":["Tres grupos: cálidos, temperados e fríos","Cinco zonas: 1 + 2 + 2","As temperadas e as frías están nos dous lados"]},"es":{"q":"La lección habla de tres grupos de climas y de cinco zonas. ¿Cómo pueden ser ciertas las dos cosas?","answer":"Los tres grupos son los climas cálidos, templados y fríos. Las zonas son cinco porque hay una cálida, dos templadas y dos frías. Hay una zona templada y una fría a cada lado de la zona cálida.","keyIdeas":["Tres grupos: cálidos, templados y fríos","Cinco zonas: 1 + 2 + 2","Las templadas y las frías están a los dos lados"]},"en":{"q":"The lesson describes three groups of climates and five zones. How can both be true?","answer":"The three groups are hot, temperate and cold climates. There are five zones because there is one hot zone, two temperate zones and two cold zones. There is one temperate zone and one cold zone on each side of the hot zone.","keyIdeas":["Three groups: hot, temperate and cold","Five zones: 1 + 2 + 2","Temperate and cold zones are on both sides"]}},{"id":"x05","topic":"relief","art":"relief","gl":{"q":"Dous lugares están igual de preto do ecuador, pero un está nunha alta montaña. Por que poden ter climas distintos?","answer":"A proximidade ao ecuador non é o único factor do clima. Tamén inflúe o relevo: nas montañas vai máis frío ca nas terras de menor altura. A alta montaña ten un clima frío con precipitacións frecuentes.","keyIdeas":["Inflúen varios factores","A maior altura, máis frío","Alta montaña: frío e precipitacións frecuentes"]},"es":{"q":"Dos lugares están igual de cerca del ecuador, pero uno está en una alta montaña. ¿Por qué pueden tener climas distintos?","answer":"La proximidad al ecuador no es el único factor del clima. También influye el relieve: en las montañas hace más frío que en las tierras de menor altura. La alta montaña tiene un clima frío con precipitaciones frecuentes.","keyIdeas":["Influyen varios factores","A mayor altura, más frío","Alta montaña: frío y precipitaciones frecuentes"]},"en":{"q":"Two places are the same distance from the equator, but one is high in the mountains. Why might their climates be different?","answer":"Distance from the equator is one of several factors that affect climate. Landforms also matter: mountains are colder than lower land. High mountains have a cold climate with frequent precipitation.","keyIdeas":["Several factors affect climate","Greater height means colder temperatures","High mountains: cold with frequent precipitation"]}},{"id":"x06","topic":"sea","art":"relief","gl":{"q":"Unha vila está na costa e outra no interior. Se as demais condicións son parecidas, onde esperas temperaturas máis suaves? Por que?","answer":"Espero temperaturas máis suaves na vila da costa. O mar suaviza as temperaturas, mentres que nas terras do interior os cambios poden ser maiores. A distancia ao mar é un dos factores que explican as diferenzas entre climas.","keyIdeas":["Na costa, máis suaves","Influencia do mar","A distancia ao mar inflúe no clima"]},"es":{"q":"Un pueblo está en la costa y otro en el interior. Si las demás condiciones son parecidas, ¿dónde esperas temperaturas más suaves? ¿Por qué?","answer":"Espero temperaturas más suaves en el pueblo de la costa. El mar suaviza las temperaturas, mientras que en las tierras del interior los cambios pueden ser mayores. La distancia al mar es uno de los factores que explican las diferencias entre climas.","keyIdeas":["En la costa, más suaves","Influencia del mar","La distancia al mar influye en el clima"]},"en":{"q":"One village is on the coast and another is inland. If other conditions are similar, where would you expect milder temperatures? Why?","answer":"I would expect milder temperatures in the coastal village. The sea makes temperatures milder, while temperatures can change more inland. Distance from the sea is one factor that explains differences between climates.","keyIdeas":["Milder temperatures on the coast","The sea's influence","Distance from the sea affects climate"]}},{"id":"x07","topic":"equatorial","art":"equatorial","gl":{"q":"Compara a selva ecuatorial coa sabana tropical. Que teñen que ver as choivas coa súa vexetación?","answer":"No clima ecuatorial vai calor e chove moito, polo que medran selvas densas. No tropical seco as choivas concéntranse nunha estación. Por iso a sabana ten unha vexetación menos densa ca a selva.","keyIdeas":["Ecuatorial: calor e moita choiva","Tropical seco: choiva nunha estación","Selva máis densa ca sabana"]},"es":{"q":"Compara la selva ecuatorial con la sabana tropical. ¿Qué tienen que ver las lluvias con su vegetación?","answer":"En el clima ecuatorial hace calor y llueve mucho, por lo que crecen selvas densas. En el tropical seco las lluvias se concentran en una estación. Por eso la sabana tiene una vegetación menos densa que la selva.","keyIdeas":["Ecuatorial: calor y mucha lluvia","Tropical seco: lluvia en una estación","Selva más densa que sabana"]},"en":{"q":"Compare the equatorial rainforest with the tropical savanna. How does rain affect their vegetation?","answer":"The equatorial climate is hot and rainy, so dense rainforests grow there. In the dry tropical climate, rain is concentrated in one season. This is why savanna vegetation is less dense than rainforest vegetation.","keyIdeas":["Equatorial: heat and plenty of rain","Dry tropical: rain in one season","Rainforest is denser than savanna"]}},{"id":"x08","topic":"desert","art":"desert","gl":{"q":"Explica a relación entre a choiva e estas tres paisaxes: selva, sabana e deserto.","answer":"Na selva ecuatorial chove moito e a vexetación é densa. Na sabana tropical as choivas concéntranse nunha estación e a vexetación é menos densa. No deserto apenas chove e medra moi pouca vexetación.","keyIdeas":["Selva: moita choiva e vexetación densa","Sabana: choiva estacional e menos densidade","Deserto: case sen choiva e pouca vexetación"]},"es":{"q":"Explica la relación entre la lluvia y estos tres paisajes: selva, sabana y desierto.","answer":"En la selva ecuatorial llueve mucho y la vegetación es densa. En la sabana tropical las lluvias se concentran en una estación y la vegetación es menos densa. En el desierto apenas llueve y crece muy poca vegetación.","keyIdeas":["Selva: mucha lluvia y vegetación densa","Sabana: lluvia estacional y menor densidad","Desierto: casi sin lluvia y poca vegetación"]},"en":{"q":"Explain how rain is linked to these three landscapes: rainforest, savanna and desert.","answer":"Equatorial rainforests receive plenty of rain and have dense vegetation. In tropical savannas, rain is concentrated in one season and vegetation is less dense. Deserts receive almost no rain and have very little vegetation.","keyIdeas":["Rainforest: plenty of rain and dense vegetation","Savanna: seasonal rain and less dense vegetation","Desert: almost no rain and little vegetation"]}},{"id":"x09","topic":"oceanic","art":"oceanic","gl":{"q":"Nos climas ecuatorial e oceánico chove moito. Son iguais? Compara temperatura, grupo e vexetación.","answer":"Os dous teñen choivas abundantes, pero non son iguais. O ecuatorial é cálido, vai calor e ten selvas. O oceánico é temperado, ten temperaturas suaves e a súa vexetación inclúe bosques e pradarías.","keyIdeas":["Os dous: moita choiva","Ecuatorial: cálido, calor e selva","Oceánico: temperado, suave, bosques e pradarías"]},"es":{"q":"En los climas ecuatorial y oceánico llueve mucho. ¿Son iguales? Compara temperatura, grupo y vegetación.","answer":"Los dos tienen lluvias abundantes, pero no son iguales. El ecuatorial es cálido, hace calor y tiene selvas. El oceánico es templado, tiene temperaturas suaves y su vegetación incluye bosques y praderas.","keyIdeas":["Los dos: mucha lluvia","Ecuatorial: cálido, calor y selva","Oceánico: templado, suave, bosques y praderas"]},"en":{"q":"Equatorial and oceanic climates both have plenty of rain. Are they the same? Compare their temperatures, groups and vegetation.","answer":"Both have plenty of rain, but they are different climates. The equatorial climate belongs to the hot group, has high temperatures and supports rainforests. The oceanic climate belongs to the temperate group, has mild temperatures and supports forests and meadows.","keyIdeas":["Both: plenty of rain","Equatorial: hot group, high temperatures and rainforest","Oceanic: temperate group, mild temperatures, forests and meadows"]}},{"id":"x10","topic":"mediterranean","art":"mediterranean","gl":{"q":"Compara os climas mediterráneo e oceánico: choivas, temperaturas e vexetación.","answer":"Os dous pertencen aos climas temperados. O mediterráneo ten choivas escasas, veráns calorosos e un bosque adaptado á seca. No oceánico chove moito, as temperaturas son suaves e hai bosques e pradarías.","keyIdeas":["Os dous son temperados","Mediterráneo: pouca choiva, calor no verán, seca","Oceánico: moita choiva, suave, bosques e pradarías"]},"es":{"q":"Compara los climas mediterráneo y oceánico: lluvias, temperaturas y vegetación.","answer":"Los dos pertenecen a los climas templados. El mediterráneo tiene lluvias escasas, veranos calurosos y un bosque adaptado a la sequía. En el oceánico llueve mucho, las temperaturas son suaves y hay bosques y praderas.","keyIdeas":["Los dos son templados","Mediterráneo: poca lluvia, calor en verano, sequía","Oceánico: mucha lluvia, suave, bosques y praderas"]},"en":{"q":"Compare Mediterranean and oceanic climates: rain, temperatures and vegetation.","answer":"Both belong to the temperate group. The Mediterranean climate has little rain, hot summers and forests adapted to drought. The oceanic climate has plenty of rain, mild temperatures, forests and meadows.","keyIdeas":["Both are temperate climates","Mediterranean: little rain, hot summers, drought","Oceanic: plenty of rain, mild temperatures, forests and meadows"]}},{"id":"x11","topic":"continental","art":"continental","gl":{"q":"Compara o inverno e o verán do clima continental. Que paisaxes lle asocia a lección?","answer":"No clima continental os invernos son moi fríos. Os veráns son cálidos e teñen choivas, polo que hai unha clara diferenza entre as estacións. A lección asóciao cos bosques de taiga e coas estepas.","keyIdeas":["Inverno: moi frío","Verán: cálido e con choivas","Taiga e estepas"]},"es":{"q":"Compara el invierno y el verano del clima continental. ¿Qué paisajes le asocia la lección?","answer":"En el clima continental los inviernos son muy fríos. Los veranos son cálidos y tienen lluvias, por lo que hay una clara diferencia entre las estaciones. La lección lo asocia con los bosques de taiga y con las estepas.","keyIdeas":["Invierno: muy frío","Verano: cálido y con lluvias","Taiga y estepas"]},"en":{"q":"Compare winter and summer in the continental climate. Which landscapes does the lesson link to it?","answer":"Winters are very cold in the continental climate. Summers are warm and rainy, so there is a clear difference between the seasons. The lesson links this climate to taiga forests and steppes.","keyIdeas":["Winter: very cold","Summer: warm and rainy","Taiga and steppes"]}},{"id":"x12","topic":"polar","art":"polar","gl":{"q":"Compara o clima polar co de alta montaña. En que se parecen e que diferenza de precipitacións destaca?","answer":"Os dous son climas fríos. O polar dáse arredor dos polos e ten precipitacións escasas, moitas veces en forma de neve. O de alta montaña está a grande altura e ten precipitacións frecuentes.","keyIdeas":["Os dous son fríos","Polar: polos e pouca precipitación","Alta montaña: altura e precipitacións frecuentes"]},"es":{"q":"Compara el clima polar con el de alta montaña. ¿En qué se parecen y qué diferencia de precipitaciones destaca?","answer":"Los dos son climas fríos. El polar se da alrededor de los polos y tiene precipitaciones escasas, muchas veces en forma de nieve. El de alta montaña está a gran altura y tiene precipitaciones frecuentes.","keyIdeas":["Los dos son fríos","Polar: polos y poca precipitación","Alta montaña: altura y precipitaciones frecuentes"]},"en":{"q":"Compare polar and high mountain climates. How are they alike, and how does their precipitation differ?","answer":"Both are cold climates. The polar climate is found around the poles and has little precipitation, often as snow. The high mountain climate is found at high elevations and has frequent precipitation.","keyIdeas":["Both are cold","Polar: near the poles with little precipitation","High mountains: great height with frequent precipitation"]}},{"id":"x13","topic":"polar","art":"polar","gl":{"q":"Unha paisaxe ten musgos e herbas, moito frío todo o ano e pouca precipitación. Identifícaa e explica as pistas.","answer":"É a tundra que a lección relaciona co clima polar. O frío de todo o ano e as precipitacións escasas son pistas dese clima. A vexetación é escasa e baixa, como os musgos e as herbas.","keyIdeas":["Identifica tundra e clima polar","Frío todo o ano e pouca precipitación","Vexetación escasa: musgos e herbas"]},"es":{"q":"Un paisaje tiene musgos y hierbas, mucho frío todo el año y poca precipitación. Identifícalo y explica las pistas.","answer":"Es la tundra que la lección relaciona con el clima polar. El frío de todo el año y las precipitaciones escasas son pistas de ese clima. La vegetación es escasa y baja, como los musgos y las hierbas.","keyIdeas":["Identifica tundra y clima polar","Frío todo el año y poca precipitación","Vegetación escasa: musgos y hierbas"]},"en":{"q":"A landscape has mosses and grasses, very cold temperatures all year and little precipitation. Identify it and explain the clues.","answer":"It is the tundra, which the lesson links to the polar climate. Cold temperatures all year and little precipitation are clues to this climate. Vegetation is sparse and low-growing, such as mosses and grasses.","keyIdeas":["Identifies tundra and the polar climate","Cold all year with little precipitation","Sparse vegetation: mosses and grasses"]}},{"id":"x14","topic":"families","art":"families","gl":{"q":"Cita tres factores que axudan a explicar por que dous lugares teñen climas distintos e di como inflúe cada un.","answer":"A proximidade ao ecuador inflúe: ao afastarnos del, as temperaturas descenden. A altura tamén inflúe: nas montañas vai máis frío. Ademais, a distancia ao mar importa porque as costas teñen temperaturas máis suaves ca o interior.","keyIdeas":["Máis lonxe do ecuador: máis frío","Máis altura: máis frío","Preto do mar: temperaturas máis suaves"]},"es":{"q":"Cita tres factores que ayudan a explicar por qué dos lugares tienen climas distintos y di cómo influye cada uno.","answer":"La proximidad al ecuador influye: al alejarnos de él, las temperaturas descienden. La altura también influye: en las montañas hace más frío. Además, la distancia al mar importa porque las costas tienen temperaturas más suaves que el interior.","keyIdeas":["Más lejos del ecuador: más frío","Más altura: más frío","Cerca del mar: temperaturas más suaves"]},"en":{"q":"Name three factors that help explain why two places have different climates, and say how each one affects climate.","answer":"Distance from the equator matters: temperatures fall as we move farther away from it. Height also matters: mountains are colder. Distance from the sea matters too, because coastal temperatures are milder than inland temperatures.","keyIdeas":["Farther from the equator: colder","Greater height: colder","Near the sea: milder temperatures"]}},{"id":"x15","topic":"mediterranean","art":"mediterranean","gl":{"q":"Dous lugares están en zonas temperadas. Por que non ten que ser igual a súa vexetación? Pon un exemplo da lección.","answer":"Dentro das zonas temperadas hai climas distintos, con diferentes temperaturas e precipitacións. Por exemplo, o bosque mediterráneo está adaptado á seca. No clima oceánico chove moito e hai bosques e pradarías.","keyIdeas":["Unha zona pode ter varios climas","Temperaturas e precipitacións inflúen na vexetación","Exemplo correcto: mediterráneo fronte a oceánico"]},"es":{"q":"Dos lugares están en zonas templadas. ¿Por qué no tiene que ser igual su vegetación? Pon un ejemplo de la lección.","answer":"Dentro de las zonas templadas hay climas distintos, con diferentes temperaturas y precipitaciones. Por ejemplo, el bosque mediterráneo está adaptado a la sequía. En el clima oceánico llueve mucho y hay bosques y praderas.","keyIdeas":["Una zona puede tener varios climas","Temperaturas y precipitaciones influyen en la vegetación","Ejemplo correcto: mediterráneo frente a oceánico"]},"en":{"q":"Two places are in temperate zones. Why might their vegetation be different? Give an example from the lesson.","answer":"Temperate zones contain different climates, with different temperatures and precipitation. For example, Mediterranean forests are adapted to drought. The oceanic climate has plenty of rain, forests and meadows.","keyIdeas":["One zone can contain several climates","Temperatures and precipitation affect vegetation","Correct example: Mediterranean compared with oceanic"]}}],"choiceLater":[{"id":"c02","topic":"climate","art":"globe","gl":{"q":"Que dúas cousas necesitamos coñecer para estudar un clima?","options":["Temperaturas e estradas","Precipitacións e edificios","Estradas e edificios","Temperaturas e precipitacións"],"explain":"Importa como son e como se distribúen ao longo do ano."},"es":{"q":"¿Qué dos cosas necesitamos conocer para estudiar un clima?","options":["Temperaturas y carreteras","Precipitaciones y edificios","Carreteras y edificios","Temperaturas y precipitaciones"],"explain":"Importa cómo son y cómo se distribuyen a lo largo del año."},"correct":3},{"id":"c09","topic":"zones","art":"zones","gl":{"q":"Onde chegan os raios solares máis perpendiculares?","options":["Preto do ecuador","Preto do polo Norte","Preto do polo Sur","En todas partes igual"],"explain":"Preto do ecuador os raios chegan máis perpendiculares e quentan máis."},"es":{"q":"¿Dónde llegan los rayos solares más perpendiculares?","options":["Cerca del ecuador","Cerca del polo Norte","Cerca del polo Sur","En todas partes igual"],"explain":"Cerca del ecuador los rayos llegan más perpendiculares y calientan más."},"correct":0},{"id":"c10","topic":"zones","art":"zones","gl":{"q":"En xeral, ao afastarnos do ecuador, a temperatura…","options":["Sobe","Non cambia","Sempre chega a 0 °C","Baixa"],"explain":"As temperaturas diminúen desde o ecuador cara aos polos."},"es":{"q":"En general, al alejarnos del ecuador, la temperatura…","options":["Sube","No cambia","Siempre llega a 0 °C","Baja"],"explain":"Las temperaturas disminuyen desde el ecuador hacia los polos."},"correct":3},{"id":"c16","topic":"families","art":"families","gl":{"q":"Que inflúe na vexetación característica de cada clima?","options":["Só a cor do chan","Temperaturas e precipitacións","Só o nome do lugar","Só o tamaño dos ríos"],"explain":"A calor, o frío e a auga condicionan a vexetación."},"es":{"q":"¿Qué influye en la vegetación característica de cada clima?","options":["Solo el color del suelo","Temperaturas y precipitaciones","Solo el nombre del lugar","Solo el tamaño de los ríos"],"explain":"El calor, el frío y el agua condicionan la vegetación."},"correct":1},{"id":"c22","topic":"tropical","art":"tropical","gl":{"q":"En comparación coa selva, a vexetación da sabana é…","options":["Máis densa","Sempre de musgos","Inexistente","Menos densa"],"explain":"Ao haber menos choiva, a vexetación é menos densa."},"es":{"q":"En comparación con la selva, la vegetación de la sabana es…","options":["Más densa","Siempre de musgos","Inexistente","Menos densa"],"explain":"Al haber menos lluvia, la vegetación es menos densa."},"correct":3},{"id":"c24","topic":"desert","art":"desert","gl":{"q":"Que parella de plantas cita o libro para algúns desertos?","options":["Abetos e piñeiros","Palmeiras e cactos","Musgos e herbas","Faias e castiñeiros"],"explain":"A vexetación é moi escasa; o libro cita palmeiras e cactos."},"es":{"q":"¿Qué pareja de plantas cita el libro para algunos desiertos?","options":["Abetos y pinos","Palmeras y cactus","Musgos y hierbas","Hayas y castaños"],"explain":"La vegetación es muy escasa; el libro cita palmeras y cactus."},"correct":1},{"id":"c26","topic":"families","art":"families","gl":{"q":"Onde se sitúan as zonas temperadas?","options":["Só arredor do ecuador","Só nos polos","Só nos cumes","Entre a cálida e as frías"],"explain":"Hai unha zona temperada a cada lado da zona cálida."},"es":{"q":"¿Dónde se sitúan las zonas templadas?","options":["Solo alrededor del ecuador","Solo en los polos","Solo en las cumbres","Entre la cálida y las frías"],"explain":"Hay una zona templada a cada lado de la zona cálida."},"correct":3},{"id":"c27","topic":"families","art":"families","gl":{"q":"Que característica sinala o libro para os climas temperados?","options":["Ausencia total de choiva","Calor ecuatorial todo o ano","Estacións diferenciadas","Frío polar todo o ano"],"explain":"Nos climas temperados distínguense as estacións."},"es":{"q":"¿Qué característica señala el libro para los climas templados?","options":["Ausencia total de lluvia","Calor ecuatorial todo el año","Estaciones diferenciadas","Frío polar todo el año"],"explain":"En los climas templados se distinguen las estaciones."},"correct":2},{"id":"c29","topic":"mediterranean","art":"mediterranean","gl":{"q":"A que se adapta o bosque mediterráneo?","options":["Á seca","Ao frío polar","Á choiva diaria","Á neve permanente"],"explain":"A súa vexetación está adaptada á falta de auga."},"es":{"q":"¿A qué se adapta el bosque mediterráneo?","options":["A la sequía","Al frío polar","A la lluvia diaria","A la nieve permanente"],"explain":"Su vegetación está adaptada a la falta de agua."},"correct":0},{"id":"c34","topic":"continental","art":"continental","gl":{"q":"Como son os veráns do clima continental segundo a lección?","options":["Moi fríos e con neve","Suaves e sen choiva","Fríos e moi secos","Cálidos e con choivas"],"explain":"O libro describe veráns cálidos e con choivas."},"es":{"q":"¿Cómo son los veranos del clima continental según la lección?","options":["Muy fríos y con nieve","Suaves y sin lluvia","Fríos y muy secos","Cálidos y con lluvias"],"explain":"El libro describe veranos cálidos y con lluvias."},"correct":3},{"id":"c36","topic":"polar","art":"polar","gl":{"q":"Onde se dá o clima polar?","options":["En todas as chairas","Arredor dos dous polos","Só arredor do ecuador","En todas as costas"],"explain":"Dáse arredor do polo Norte e do polo Sur."},"es":{"q":"¿Dónde se da el clima polar?","options":["En todas las llanuras","Alrededor de los dos polos","Solo alrededor del ecuador","En todas las costas"],"explain":"Se da alrededor del polo Norte y del polo Sur."},"correct":1},{"id":"c38","topic":"polar","art":"polar","gl":{"q":"Como son as precipitacións no clima polar?","options":["Abundantes, sempre choiva","Diarias, sempre sarabia","Nunca cae auga nin neve","Escasas, adoito neve"],"explain":"As precipitacións son escasas e adoitan ser en forma de neve."},"es":{"q":"¿Cómo son las precipitaciones en el clima polar?","options":["Abundantes, siempre lluvia","Diarias, siempre granizo","Nunca cae agua ni nieve","Escasas, a menudo nieve"],"explain":"Las precipitaciones son escasas y suelen ser en forma de nieve."},"correct":3}],"buildLater":[{"id":"b02","topic":"climate","art":"globe","gl":{"q":"Ordena o que precisamos coñecer. Comeza por «Para estudar o clima,».","chunks":["Para estudar o clima,","coñecemos as temperaturas","e as precipitacións","ao longo do ano."],"explain":"Importan a cantidade e a distribución durante o ano."},"es":{"q":"Ordena lo que necesitamos conocer. Empieza por «Para estudiar el clima,».","chunks":["Para estudiar el clima,","conocemos las temperaturas","y las precipitaciones","a lo largo del año."],"explain":"Importan la cantidad y la distribución durante el año."}},{"id":"b05","topic":"precipitation","art":"rain","gl":{"q":"Ordena como medimos a auga caída. Comeza por «A cantidade de precipitación».","chunks":["A cantidade de precipitación","que cae nun lugar","mídese co","pluviómetro."],"explain":"O pluviómetro mide precipitacións."},"es":{"q":"Ordena cómo medimos el agua caída. Empieza por «La cantidad de precipitación».","chunks":["La cantidad de precipitación","que cae en un lugar","se mide con el","pluviómetro."],"explain":"El pluviómetro mide precipitaciones."}},{"id":"b07","topic":"zones","art":"zones","gl":{"q":"Ordena as zonas desde o centro cara aos extremos. Comeza por «Hai unha zona cálida,».","chunks":["Hai unha zona cálida,","a cada lado unha temperada","e, preto de cada polo,","unha zona fría."],"explain":"En total: unha cálida, dúas temperadas e dúas frías."},"es":{"q":"Ordena las zonas desde el centro hacia los extremos. Empieza por «Hay una zona cálida,».","chunks":["Hay una zona cálida,","a cada lado una templada","y, cerca de cada polo,","una zona fría."], function mergePatternProgress(incoming){
 for(const [key,value] of Object.entries(incoming.sessions))if(!state.pattern.sessions[key])state.pattern.sessions[key]=value;

 const ids=FLASH_CARDS.map(c=>c.id),unique=a=>Array.isArray(a)&&a.length<=ids.length&&new Set(a).size===a.length&&a.every(id=>ids.includes(id));

 const log=[],attempts={};for(const x of raw.log){if(!x||!raw.original.includes(x.id)||!FLASH_GRADES.includes(x.grade))return null;attempts[x.id]=(attempts[x.id]||0)+1;if(attempts[x.id]>3)return null;log.push({id:x.id,grade:x.grade});}
 const completed=raw.original.filter(id=>!raw.queue.includes(id));

 return `<section class="climate-classification${forPrint?' print-classification':''}" aria-labelledby="${headingId}"><h2 id="${headingId}">${esc(copy.title)}</h2><table><thead><tr><th scope="col">${esc(copy.group)}</th><th scope="col">${esc(copy.types)}</th></tr></thead><tbody>${CLIMATE_GROUPS.map(group=>`<tr><th scope="row">${esc(t('groups')[group])}</th><td>${LESSONS.filter(l=>l.group===group).map(l=>esc(l[state.lang].title)).join(' · ')}</td></tr>`).join('')}</tbody></table><p class="classification-note">${esc(copy.note)}</p></section>`;

function renderStudy(){if(state.overview)return `<div class="section-head"><div><div class="eyebrow">${stepLabel(state.level)}</div><h2 style="margin-top:7px">${t('allNotes')}</h2></div>${button(t('backCards'),'overview','btn alt small')}</div><p class="map-note">${t('fullMap')}</p>${renderClassification()}<div class="overview-grid">${LESSONS.map((l,i)=>`<article class="overview-card"><div class="thumb" aria-hidden="true">${climateArt(l.art,state.lang)}</div><div class="eyebrow">${t('groups')[l.group]}</div><h3>${esc(l[state.lang].title)}</h3><p>${esc(studyText(l))}</p>${button(t('card')+' '+(i+1),'card','text-button',`data-index="${i}"`)}</article>`).join('')}</div><div class="study-bottom">${button(t('print'),'print','btn alt')}${button(t('try')+' →','to-play','btn')}</div>`;
 const l=LESSONS[state.index],d=l[state.lang],known=state.learned[state.level].includes(l.id),studied=state.learned[state.level].length;
 return `<div class="section-head"><div><div class="eyebrow">${t('flashcards')}</div><p>${t('levelHints')[state.level-1]}</p></div><div class="small-tools">${button(t('allNotes'),'overview','text-button')}<span class="count-pill">${state.index+1} / ${LESSONS.length}</span></div></div><article class="study-card"><div class="scene"><span class="scene-caption">${t('groups')[l.group]}</span>${climateArt(l.art,state.lang)}</div><div class="study-text level-${state.level}"><h2>${esc(d.title)}</h2>${state.hidden?`<p class="hidden-answer">${t('hidden')}</p>`:`<p class="lesson-answer">${esc(studyText(l))}</p>`}${state.level>=3&&!state.hidden?`<p class="lesson-subprompt">${t('say')}</p>`:''}${button(state.hidden?t('show'):t('hide'),'hide','text-button reveal')}</div></article><div class="study-nav">${button('← '+t('prev'),'prev','btn alt',state.index===0?'disabled':'')}<div class="middle">${button(known?'✓ '+t('know'):t('know')+' ✓','know','btn soft',`aria-label="${known?t('known'):t('know')}"`)}${button(t('next')+' →','next','btn alt',state.index===LESSONS.length-1?'disabled':'')}</div></div><div class="topic-picker"><label for="jump" class="sr-only">${t('jump')}</label><select id="jump" data-action="jump">${LESSONS.map((x,i)=>`<option value="${i}" ${state.index===i?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(x[state.lang].title)}</option>`).join('')}</select></div><div class="study-bottom"><span class="micro"><span class="mini-progress"><i style="width:${studied/LESSONS.length*100}%"></i></span>${studied} / ${LESSONS.length} ${t('studied')}</span>${button(t('try')+' →','to-play','btn')}</div>`;
}
function renderPlay(){const r=round();if(r?.done)return renderResult(r);if(r&&!state.paused)return renderQuestion(r);return renderSetup(r);}
function renderSetup(r){const self=state.level>=3;return `<div class="setup"><div class="setup-art" aria-hidden="true">${climateArt(state.level===4?'summit':'families',state.lang)}</div><div class="setup-content"><div class="eyebrow">${stepLabel(state.level)}</div><h2>${t('setupTitle')[state.level-1]}</h2><p>${t('setupDesc')[state.level-1]}</p>${r?`<div class="fine-note">${t('resumeNote')} ${r.i+1} / ${r.keys.length}.</div><div class="start-row">${button(t('continue')+' →','resume','btn')}</div><p class="micro" style="margin-top:14px">${t('newAfter')}</p>`:`<div class="setup-group"><span>${t('roundLength')}</span><div class="segmented">${[10,15].map(n=>button(n===10?t('shortRound'):t('wholeRound'),'count','',`data-count="${n}" aria-pressed="${state.count===n}"`)).join('')}</div></div>${!self?`<div class="setup-group"><span>${t('mode')}</span><div class="segmented">${['practice','exam'].map(m=>button(t(m),'style','',`data-style="${m}" aria-pressed="${state.style===m}"`)).join('')}</div></div>`:''}<p class="micro">${self?t('selfHelp'):t(state.style+'Help')}</p><div class="start-row">${button(t('start')+' →','start','btn gold')}${pending().length?button(t('reviewMistakes')+' · '+pending().length,'review','btn alt'):''}</div>`}</div></div><p class="fine-note">${t('noPressure')} ${t('noteShared')}</p>`;}
function orderedQuestions(level,count){const kind=KINDS[level-1],bank=BANKS[kind],seen=new Set(state.history.filter(h=>h.level===level).slice(-2).flatMap(h=>h.ids||[]));const pool=shuffle(bank).sort((a,b)=>Number(seen.has(a.id))-Number(seen.has(b.id)));let chosen=[];
 if(count===15){for(const lesson of LESSONS){const q=pool.find(x=>x.topic===lesson.id&&!chosen.includes(x));if(q)chosen.push(q);}}
 else{for(const [group,n]of [['base',2],['factors',2],['warm',2],['temperate',2],['cold',2]]){const topics=LESSONS.filter(l=>l.group===group).map(l=>l.id);let used=[];for(let i=0;i<n;i++){const q=pool.find(x=>topics.includes(x.topic)&&!used.includes(x.topic)&&!chosen.includes(x));if(q){chosen.push(q);used.push(q.topic);}}}}
 for(const q of pool){if(chosen.length>=count)break;if(!chosen.includes(q))chosen.push(q);}return shuffle(chosen.slice(0,count)).map(q=>({kind,id:q.id}));}
function makeCurrent(r){const q=getQ(r.keys[r.i]),n=r.level===1?q.gl.options.length:r.level===2?q.gl.chunks.length:0;let order=shuffle(Array.from({length:n},(_,i)=>i));if(n>1&&order.every((x,i)=>x===i))order.push(order.shift());r.current={order,selected:[],checks:[],revealed:false,checked:false,choice:null,typed:'',write:false,correct:false};}
function startRound(review=false){const keys=review?shuffle(pending()).slice(0,15):orderedQuestions(state.level,state.count);if(!keys.length)return;const r={uid:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),level:state.level,style:state.level>=3?'self':review?'practice':state.style,review,keys,i:0,answers:[],done:false,resultsSaved:false,date:new Date().toISOString()};makeCurrent(r);state.sessions[state.level]=r;state.paused=false;state.tab='play';statusText='';save();render();focusQuestion();}
function focusQuestion(){requestAnimationFrame(()=>{const h=document.getElementById('question-heading');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}});}
function renderQuestion(r){const q=getQ(r.keys[r.i]),d=q[state.lang],c=r.current,isExam=r.style==='exam',self=r.level>=3,completed=r.answers.filter(Boolean).filter(a=>a.correct).length;
 const label=r.level===1?t('choicePrompt'):r.level===2?t('buildPrompt'):r.level===3?t('explainPrompt'):t('connectPrompt');
 return `<div class="round-wrap"><div class="round-top"><span>${t('question')} <b>${r.i+1}</b> ${t('of')} ${r.keys.length}${r.review?' · '+t('reviewLabel'):''}</span><div class="round-right">${!isExam?`<span>${self?'✓':'★'} ${completed} ${self?(completed===1?t('oneComplete'):t('selfScore')):(completed===1?t('oneCorrect'):t('points'))}</span>`:`<span>${t('exam')}</span>`}${button(t('pause'),'pause','text-button')}</div></div><div class="progress-track" role="progressbar" aria-valuenow="${r.i}" aria-valuemin="0" aria-valuemax="${r.keys.length}" aria-label="${t('question')}"><i style="width:${r.i/r.keys.length*100}%"></i></div><article class="question-card"><div class="question-kicker"><span class="badge">${state.level}</span>${label}<span style="margin-left:auto">${t('lengths')[state.level-1]}</span></div><h2 id="question-heading">${esc(d.q)}</h2>${r.level===1?renderChoice(q,c,isExam):r.level===2?renderBuild(q,c):renderOral(q,c)}${c.checked?renderFeedback(r,q):''}${c.checked?`<div class="round-next">${button(r.i===r.keys.length-1?t('finish'):t('next')+' →','next-question','btn gold','id="next-question"')}</div>`:''}</article></div>`;
}
function renderChoice(q,c,isExam){const d=q[state.lang];return `<div class="answers">${c.order.map((i,pos)=>{let cls='';if(c.checked){if(isExam){if(c.choice===i)cls=' selected';}else if(i===q.correct)cls=' correct';else if(c.choice===i)cls=' wrong';}return `<button type="button" class="answer${cls}" data-action="answer" data-option="${i}" ${c.checked?'disabled':''}><span class="letter" aria-hidden="true">${'ABCD'[pos]}</span><span>${esc(d.options[i])}</span></button>`;}).join('')}</div>`;}

function renderOral(q,c){const d=q[state.lang];return `${!c.revealed?`<div class="oral-intro"><strong>${t('outLoud')}</strong>${t('oralHelp')}</div><div class="oral-actions">${button(t('compare'),'reveal-model','btn gold')}${!c.write?button(t('writeInstead'),'write','text-button'):''}</div>`:''}${c.write?`<label class="sr-only" for="oral-text">${t('yourAnswer')}</label><textarea id="oral-text" class="write-area" placeholder="${t('writePlaceholder')}" maxlength="2500" ${c.revealed?'readonly':''}>${esc(c.typed)}</textarea>`:''}${c.revealed?`<div class="model"><div class="eyebrow">${t('modelAnswer')}</div><p>${esc(d.answer)}</p><p style="margin-top:17px;font-weight:700;font-size:.88rem">${t('included')}</p><div class="checklist">${d.keyIdeas.map((idea,i)=>`<label class="checkitem"><input type="checkbox" data-check="${i}" ${c.checks.includes(i)?'checked':''} ${c.checked?'disabled':''}><span>${esc(idea)}</span></label>`).join('')}</div><p class="micro" style="margin-top:13px">${t('selfNote')}</p></div>${!c.checked?`<div class="round-next">${button(t('saveSelf'),'check-self','btn')}</div>`:''}`:''}`;}
function renderFeedback(r,q){const c=r.current,d=q[state.lang];if(r.style==='exam')return `<div class="feedback" role="status"><strong>${t('savedAnswer')}</strong>${t('examFeedback')}</div>`;if(r.level>=3)return `<div class="feedback ${c.correct?'good':'bad'}" role="status"><strong>${c.checks.length} / ${d.keyIdeas.length} ${t('ideas')}</strong>${c.correct?t('complete'):t('keepLearning')}</div>`;const expected=r.level===1?d.options[q.correct]:d.chunks.join(' ');return `<div class="feedback ${c.correct?'good':'bad'}" role="status"><strong class="${c.correct?'spark':''}">${c.correct?t('nice')[r.i%t('nice').length]:t('retry')}</strong>${esc(d.explain)}${!c.correct?`<div class="expected">${t('correctAnswer')} ${esc(expected)}</div>`:''}</div>`;}
function acceptAnswer(correct){const r=round(),c=r.current;if(c.checked)return;c.checked=true;c.correct=correct;r.answers[r.i]={ref:r.keys[r.i],correct,choice:c.choice,selected:c.selected.slice(),checks:c.checks.slice(),typed:c.typed,lang:state.lang};beep(correct,r.style==='exam');save();render();requestAnimationFrame(()=>document.getElementById('next-question')?.focus({preventScroll:true}));}
function finishRound(r){r.done=true;if(!r.resultsSaved){r.resultsSaved=true;const score=r.answers.filter(a=>a.correct).length;state.history.push({uid:r.uid,level:r.level,style:r.style,review:r.review,date:new Date().toISOString(),score,total:r.keys.length,lang:state.lang,ids:r.keys.map(x=>x.id)});state.history=state.history.slice(-100);for(const a of r.answers){state.mistakes=state.mistakes.filter(x=>refKey(x)!==refKey(a.ref));if(!a.correct)state.mistakes.push(a.ref);}}save();render();}
function renderResult(r){const score=r.answers.filter(a=>a.correct).length,total=r.keys.length,rate=score/total,self=r.level>=3,failed=r.answers.filter(a=>!a.correct);return `<div class="result-hero"><div class="art" aria-hidden="true">${climateArt('summit',state.lang)}</div><div><div class="eyebrow">${r.review?t('finishReview'):stepLabel(r.level)}</div><div class="result-score">${score}<span>/ ${total} ${self?t('selfOf'):t('rightOf')}</span></div><div class="stars" aria-hidden="true">${rate===1?'★★★':rate>=.7?'★★☆':rate>=.4?'★☆☆':'☆☆☆'}</div><h2 style="margin-top:10px">${rate===1?t('resultTitle'):rate>=.6?t('resultGood'):t('resultStart')}</h2><p>${self?t('selfResult'):rate===1?t('resultPerfect'):t('resultPractice')}</p><div class="result-actions">${failed.length?button(t('reviewPending')+' · '+failed.length,'review-result','btn gold'):button(t('again'),'again','btn gold')}${rate>=.8&&state.level<4?button(t('nextLevel')+' →','next-level','btn alt'):button(t('studyAgain'),'study-again','btn alt')}${failed.length?button(t('again'),'again','btn alt'):''}${button(t('newRound'),'new-round','text-button')}</div></div></div><div class="section-head" style="margin-top:28px"><h3>${t('reviewAnswers')}</h3><span class="micro">${total} ${t('answered')}</span></div><div class="review-list">${r.answers.map((a,i)=>renderReviewItem(a,i)).join('')}</div>`;}
function renderReviewItem(a,i){const q=getQ(a.ref),d=q[state.lang],isChoice=a.ref.kind==='choice',isBuild=a.ref.kind==='build',expected=isChoice?d.options[q.correct]:isBuild?d.chunks.join(' '):d.answer;const own=isChoice?d.options[a.choice]:isBuild?a.selected.map(j=>d.chunks[j]).join(' '):a.typed||t('notWritten');return `<details class="review-item" ${!a.correct?'open':''}><summary><span class="review-status ${a.correct?'':'miss'}">${a.correct?'✓':'↻'}</span><span>${i+1}. ${esc(d.q)}</span><span class="review-arrow">⌄</span></summary><div class="review-copy"><p><strong>${t('yourAnswer')}:</strong> ${esc(own)}</p><div class="model-answer"><strong>${isChoice||isBuild?t('correctAnswer'):t('modelAnswer')+':'}</strong> ${esc(expected)}</div>${d.explain?`<p style="margin-top:9px">${esc(d.explain)}</p>`:`<p style="margin-top:9px">${a.checks.length} / ${d.keyIdeas.length} ${t('ideas')} · ${t('selfLabel')}</p>`}</div></details>`;}
function renderProgress(){const any=state.history.length||state.pattern.history.length||state.flash.history.length||Object.keys(state.flash.stats).length||Object.values(state.learned).some(x=>x.length);return `<div class="section-head"><div><h2>${t('progressTitle')}</h2><p style="margin-top:9px">${t('progressIntro')}</p></div></div><div class="progress-cards">${[1,2,3,4].map(l=>{const b=best(l),seen=state.learned[l].length;return `<article class="progress-card"><div class="eyebrow">${t('step')} ${l}</div><h3 style="margin-top:5px">${t('levels')[l-1]}</h3><div class="big-number">${b?Math.round(b.score/b.total*100)+'%':'—'}</div><p class="micro">${b?l>=3?t('selfLabel'):t('best'):t('noRounds')}</p><p class="micro" style="margin-top:9px">${seen} / 15 ${t('studied')}</p>${button(t('continueLearning'),'progress-level','btn small alt',`data-level="${l}"`)}</article>`;}).join('')}</div>${!any?`<div class="empty-state"><h3>${t('progressEmpty')}</h3><p>${t('progressEmptyDesc')}</p>${button(t('returnStudy'),'study-again','btn')}</div>`:''}${state.history.length?`<h3 style="margin-top:25px">${t('recent')}</h3><div class="history"><div class="history-row"><span>${t('date')}</span><span>${t('step')}</span><span>${t('score')}</span></div>${state.history.slice(-8).reverse().map(h=>`<div class="history-row"><span>${new Date(h.date).toLocaleDateString({gl:'gl-ES',es:'es-ES',en:'en-GB'}[state.lang],{day:'2-digit',month:'short'})}</span><span>${h.level} · ${t('levels')[h.level-1]}${h.review?' · '+t('reviewLabel'):h.style==='exam'?' · '+t('exam'):h.level>=3?' · '+t('selfLabel'):''}</span><span>${h.score} / ${h.total}</span></div>`).join('')}</div>`:''}<p class="fine-note">${t('selfResult')}</p>${renderPatternProgress()}${renderFlashProgress()}`;}
function renderFooter(active){return `<footer class="footer"><div class="footer-line"><span>◌ ${t('offline')}</span><span>${storageOK?'✓ '+t('localSave'):t('saveUnavailable')}</span><span>${t('version')}</span></div>${!storageOK?`<p class="fine-note">${t('storageError')}</p>`:''}<details id="backup-details"><summary>${t('backup')}</summary><div class="footer-content"><p>${t('backupText')}</p><p>${t('backupInfo')}</p><div class="backup-actions">${button(t('downloadHTML'),'download-html','btn alt small')}${button(t('export'),'export','btn alt small')}${button(t('import'),'import','btn alt small')}${button(t('print'),'print','btn alt small')}</div><input id="import-file" type="file" accept=".json,application/json" hidden><p>${t('source')}</p><p>${t('noteShared')}</p></div></details><details><summary>${t('helpFamily')}</summary><div class="footer-content"><p>${t('familyText')}</p><p>${t('keyboard')}</p><p><a href="./crear-apuntes/">${esc({gl:'Crear apuntes doutro tema',es:'Crear apuntes de otro tema',en:'Create notes for another topic'}[state.lang])}</a></p></div></details><div id="status" class="status" role="status" aria-live="polite"></div></footer>`;}
function updatePrint(mode=state.tab==='map'?'map':state.tab==='table'?'table':state.tab==='cards'?'cards':'notes'){
 if(mode==='cards'){printFlash();return;}
 if(mode==='table'){printPatterns(state.pattern.view==='exercise'?'exam':'study');return;}
 if(mode==='map'){printMindMap();return;}
 const copy=CLASSIFICATION_COPY[state.lang];
 const sections=[{title:copy.basics,items:LESSONS.filter(l=>!CLIMATE_GROUPS.includes(l.group))},...CLIMATE_GROUPS.map(group=>({title:t('groups')[group],items:LESSONS.filter(l=>l.group===group)}))];
 const cards=items=>items.map(l=>`<section class="print-card" data-lesson="${l.id}"><p class="print-category">${esc(t('groups')[l.group])}</p>${climateArt(l.art,state.lang)}<h3>${LESSONS.indexOf(l)+1}. ${esc(l[state.lang].title)}</h3><p>${esc(studyText(l))}</p></section>`).join('');
 document.getElementById('print-sheet').innerHTML=`<h1>${t('printTitle')}</h1><p class="print-sub">${stepLabel(state.level)} · ${t('printHelp')}</p>${renderClassification(true)}${sections.map(group=>`<section class="print-section"><h2 class="print-group-title">${esc(group.title)}</h2><div class="print-grid">${cards(group.items)}</div></section>`).join('')}<p class="print-note">${t('source')} · ${t('version')}</p>`;
}
function downloadProgress(){const payload={format:'climas-escaleira',version:1,exported:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='climas-progreso-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notifyStatus(t('exportOk'));}
function notifyStatus(msg){statusText=msg;const el=document.getElementById('status');if(el)el.textContent=msg;}
async function importProgress(file){try{if(!file||file.size>2*1024*1024)throw Error();const data=JSON.parse(await file.text());if(data.format!=='climas-escaleira'||data.version!==1||data.state?.version!==1||!data.state.learned||!Array.isArray(data.state.history))throw Error();const incoming=sanitize(data.state);for(let l=1;l<=4;l++){state.learned[l]=[...new Set([...state.learned[l],...incoming.learned[l]])];if(!state.sessions[l]&&incoming.sessions[l])state.sessions[l]=incoming.sessions[l];}const h=new Map([...incoming.history,...state.history].map(x=>[x.uid,x]));state.history=[...h.values()].sort((a,b)=>a.date.localeCompare(b.date)).slice(-100);const m=new Map([...incoming.mistakes,...state.mistakes].map(x=>[refKey(x),x]));state.mistakes=[...m.values()];mergePatternProgress(incoming.pattern);mergeFlashProgress(incoming.flash);save();statusText=t('importOk');render();document.getElementById('backup-details').open=true;}catch(e){notifyStatus(t('importError'));}}
app.addEventListener('input',e=>{if(e.target.id==='oral-text'){const r=round();if(r&&!r.current.revealed){r.current.typed=e.target.value;save();}}});
app.addEventListener('change',e=>{if(e.target.matches('[data-pattern-hole]')){changePatternAnswer(e.target.dataset.patternHole,e.target.value);return;}if(e.target.id==='jump'){state.index=Number(e.target.value);state.hidden=false;statusText='';save();render();}if(e.target.matches('[data-check]')){const r=round();if(!r||r.current.checked)return;const i=Number(e.target.dataset.check);r.current.checks=r.current.checks.filter(x=>x!==i);if(e.target.checked)r.current.checks.push(i);save();}if(e.target.id==='import-file')importProgress(e.target.files[0]);});
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,r=round(),c=r?.current;
 if(a.startsWith('pattern-')){patternAction(a,b.dataset);return;}
 if(a.startsWith('flash-')){flashAction(a,b.dataset);return;}
 if(a==='lang'){if(state.lang===b.dataset.lang)return;state.lang=b.dataset.lang;statusText='';save();render();focusMap('lang-'+state.lang);return;}
 if(a==='map-group'){const group=b.dataset.group;if(!MAP_GROUPS.includes(group))return;if(state.mapOpen.includes(group)){state.mapOpen=state.mapOpen.filter(x=>x!==group);for(const l of LESSONS.filter(l=>l.group===group))delete state.mapDepth[l.id];}else state.mapOpen.push(group);save();render();focusMap('map-group-'+group);return;}
 if(a==='map-all'){state.mapOpen=MAP_GROUPS.slice();state.mapDepth={};}
 if(a==='map-close'){state.mapOpen=[];state.mapDepth={};}
 if(['map-leaf','map-deeper','map-shallower','map-study'].includes(a)){
 const l=LESSONS.find(l=>l.id===b.dataset.id&&MAP_GROUPS.includes(l.group));if(!l)return;
 const depth=state.mapDepth[l.id]||0;
 if(a==='map-leaf'){if(depth)delete state.mapDepth[l.id];else state.mapDepth[l.id]=1;}
 if(a==='map-deeper')state.mapDepth[l.id]=Math.min(4,depth+1);
 if(a==='map-shallower')state.mapDepth[l.id]=Math.max(1,depth-1);
 if(a==='map-study'){state.tab='study';state.index=LESSONS.indexOf(l);state.level=depth||1;state.overview=false;state.hidden=false;}
 save();render();if(a!=='map-study')focusMap('map-leaf-'+l.id);return;
 }
 if(a==='map-basics'){state.tab='study';state.index=0;state.overview=false;state.hidden=false;}
 if(a==='sound'){state.sound=!state.sound;beep(true,true);save();render();return;}
 if(a==='tab'){state.tab=b.dataset.tab;if(state.tab==='play')state.paused=false;statusText='';}
 if(a==='level'){state.level=Number(b.dataset.level);state.hidden=false;state.paused=false;statusText='';}
 if(a==='overview'){state.overview=!state.overview;state.hidden=false;}
 if(a==='hide')state.hidden=!state.hidden;
 if(a==='prev'||a==='next'){state.index=Math.max(0,Math.min(LESSONS.length-1,state.index+(a==='next'?1:-1)));state.hidden=false;statusText='';}
 if(a==='card'){state.index=Number(b.dataset.index);state.overview=false;state.hidden=false;}
 if(a==='know'){const id=LESSONS[state.index].id;if(!state.learned[state.level].includes(id)){state.learned[state.level].push(id);beep(true,true);}statusText=state.learned[state.level].length===15?t('passStudy'):t('finishedStudy');if(state.index<LESSONS.length-1)state.index++;state.hidden=false;}
 if(a==='to-play'){state.tab='play';state.paused=false;statusText='';}
 if(a==='count')state.count=Number(b.dataset.count);
 if(a==='style')state.style=b.dataset.style;
 if(a==='start'){startRound();return;}
 if(a==='review'){startRound(true);return;}
 if(a==='resume'){state.paused=false;statusText='';}
 if(a==='pause'){state.paused=true;statusText=t('exitPause');}
 if(a==='answer'){if(!r||c.checked)return;c.choice=Number(b.dataset.option);acceptAnswer(c.choice===getQ(r.keys[r.i]).correct);return;}
 if(a==='word'){if(!r||c.checked)return;const i=Number(b.dataset.word);if(!c.selected.includes(i))c.selected.push(i);}
 if(a==='remove-word'&&!c.checked)c.selected.splice(Number(b.dataset.pos),1);
 if(a==='undo'&&!c.checked)c.selected.pop();
 if(a==='check-build'){if(!r||c.checked)return;const n=getQ(r.keys[r.i])[state.lang].chunks.length;if(c.selected.length!==n)return;acceptAnswer(c.selected.every((x,i)=>x===i));return;}
 if(a==='write'){c.write=true;save();render();document.getElementById('oral-text').focus({preventScroll:true});return;}
 if(a==='reveal-model'){if(c.revealed)return;c.revealed=true;}
 if(a==='check-self'){if(!c.revealed)return;acceptAnswer(c.checks.length===getQ(r.keys[r.i])[state.lang].keyIdeas.length);return;}
 if(a==='next-question'){if(!c.checked)return;if(r.i===r.keys.length-1){finishRound(r);return;}r.i++;makeCurrent(r);save();render();focusQuestion();return;}
 if(a==='new-round'){if(r?.done){delete state.sessions[state.level];state.paused=false;statusText='';}}
 if(a==='again'){delete state.sessions[state.level];startRound();return;}
 if(a==='review-result'){const failed=r.answers.filter(x=>!x.correct).map(x=>x.ref);delete state.sessions[state.level];const nr={uid:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),level:state.level,style:state.level>=3?'self':'practice',review:true,keys:shuffle(failed),i:0,answers:[],done:false,resultsSaved:false,date:new Date().toISOString()};if(!nr.keys.length)return;makeCurrent(nr);state.sessions[state.level]=nr;state.paused=false;save();render();focusQuestion();return;}
 if(a==='next-level'){state.level=Math.min(4,state.level+1);state.tab='study';state.index=0;state.overview=false;state.hidden=false;}
 if(a==='study-again'){state.tab='study';state.overview=false;state.hidden=false;statusText='';}
 if(a==='progress-level'){state.level=Number(b.dataset.level);state.tab='study';state.overview=false;state.hidden=false;}
 if(a==='export'){downloadProgress();return;}
 if(a==='import'){document.getElementById('import-file').click();return;}
 if(a==='print'||a==='print-map'){updatePrint(a==='print-map'?'map':'notes');window.print();return;}
 if(a==='download-html'){downloadHTML();return;}
 save();render();if(a==='map-all'||a==='map-close')focusMap(a);if(a==='tab')focusMap('tab-'+state.tab);
});

app.addEventListener('keydown',e=>{
 const b=e.target.closest('button[role="tab"]');if(!b||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 const tabs=[...b.parentElement.querySelectorAll('button[role="tab"]')],i=tabs.indexOf(b);
 const target=e.key==='Home'?tabs[0]:e.key==='End'?tabs[tabs.length-1]:tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];
 e.preventDefault();const id=target.id;target.click();focusMap(id);
});
window.addEventListener('afterprint',()=>updatePrint());

save();render();

</script>
</body>
</html>
