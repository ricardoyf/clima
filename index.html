<script>
const CONTENT={"source":"Fotografía achegada: Coñecemos os climas / Os climas da Terra, páxinas 24–25.","lessons":[{"id":"climate","group":"base","art":"globe","gl":{"title":"Que é o clima?","cue":"Atmosfera. Un lugar. Uns 30 anos.","phrase":"O clima describe a atmosfera dun lugar ao longo duns trinta anos.","explain":"O clima é o conxunto de condicións da atmosfera dun lugar ao longo duns trinta anos. Para coñecelo, observamos as temperaturas e as precipitacións, e como se distribúen nas estacións do ano. Un só día non define o clima.","challenge":"Explica que é o clima e que observamos para coñecelo.","answer":"O clima é o conxunto de condicións da atmosfera dun lugar ao longo duns trinta anos. Coñecémolo estudando as temperaturas e as precipitacións e como se distribúen nas estacións do ano.","keyIdeas":["Un lugar durante uns trinta anos","Temperaturas e precipitacións","Como cambian nas estacións"]},"es":{"title":"¿Qué es el clima?","cue":"Atmósfera. Un lugar. Unos 30 años.","phrase":"El clima describe la atmósfera de un lugar durante unos treinta años.","explain":"El clima es el conjunto de condiciones de la atmósfera de un lugar durante unos treinta años. Para conocerlo, observamos las temperaturas y las precipitaciones, y cómo se distribuyen en las estaciones del año. Un solo día no define el clima.","challenge":"Explica qué es el clima y qué observamos para conocerlo.","answer":"El clima es el conjunto de condiciones de la atmósfera de un lugar durante unos treinta años. Lo conocemos estudiando las temperaturas y las precipitaciones y cómo se distribuyen en las estaciones del año.","keyIdeas":["Un lugar durante unos treinta años","Temperaturas y precipitaciones","Cómo cambian en las estaciones"]}},{"id":"temperature","group":"base","art":"thermometer","gl":{"title":"As temperaturas","cue":"Frío ou calor. Termómetro. Celsius (°C).","phrase":"A temperatura indica frío ou calor; mídese co termómetro en graos Celsius.","explain":"As temperaturas indican se vai calor ou frío. Para medilas usamos o termómetro e expresamos o resultado en graos Celsius, que se escriben °C. Coñecer as temperaturas nas distintas estacións axúdanos a coñecer o clima.","challenge":"Que indica a temperatura? Con que se mide e en que unidade se expresa?","answer":"A temperatura indica se vai calor ou frío. Mídese co termómetro e exprésase en graos Celsius, °C.","keyIdeas":["Calor ou frío","Termómetro","Graos Celsius: °C"]},"es":{"title":"Las temperaturas","cue":"Frío o calor. Termómetro. Celsius (°C).","phrase":"La temperatura indica frío o calor; se mide con el termómetro en grados Celsius.","explain":"Las temperaturas indican si hace calor o frío. Para medirlas usamos el termómetro y expresamos el resultado en grados Celsius, que se escriben °C. Conocer las temperaturas en las distintas estaciones nos ayuda a conocer el clima.","challenge":"¿Qué indica la temperatura? ¿Con qué se mide y en qué unidad se expresa?","answer":"La temperatura indica si hace calor o frío. Se mide con el termómetro y se expresa en grados Celsius, °C.","keyIdeas":["Calor o frío","Termómetro","Grados Celsius: °C"]}},{"id":"precipitation","group":"base","art":"rain","gl":{"title":"As precipitacións","cue":"Auga: choiva, neve, sarabia. Pluviómetro.","phrase":"Choiva, neve ou sarabia: a cantidade de auga mídese co pluviómetro.","explain":"As precipitacións son a auga que cae da atmosfera. Poden ser en forma de choiva, neve ou sarabia. A cantidade de auga recollida mídese co pluviómetro. Para coñecer o clima tamén importa en que estacións cae.","challenge":"Que son as precipitacións? Di as tres formas e o instrumento que as mide.","answer":"As precipitacións son a auga que cae da atmosfera en forma de choiva, neve ou sarabia. A cantidade de auga recollida mídese co pluviómetro.","keyIdeas":["Auga que cae da atmosfera","Choiva, neve e sarabia","Pluviómetro"]},"es":{"title":"Las precipitaciones","cue":"Agua: lluvia, nieve, granizo. Pluviómetro.","phrase":"Lluvia, nieve o granizo: la cantidad de agua se mide con el pluviómetro.","explain":"Las precipitaciones son el agua que cae de la atmósfera. Pueden ser en forma de lluvia, nieve o granizo. La cantidad de agua recogida se mide con el pluviómetro. Para conocer el clima también importa en qué estaciones cae.","challenge":"¿Qué son las precipitaciones? Di las tres formas y el instrumento que las mide.","answer":"Las precipitaciones son el agua que cae de la atmósfera en forma de lluvia, nieve o granizo. La cantidad de agua recogida se mide con el pluviómetro.","keyIdeas":["Agua que cae de la atmósfera","Lluvia, nieve y granizo","Pluviómetro"]}},{"id":"zones","group":"factors","art":"zones","gl":{"title":"O ecuador e as zonas","cue":"1 cálida. 2 temperadas. 2 frías.","phrase":"Preto do ecuador vai máis calor; ao afastarnos, as temperaturas van baixando.","explain":"Preto do ecuador, os raios solares chegan máis perpendiculares e vai máis calor. Ao afastarnos del, as temperaturas van baixando. Distinguimos cinco zonas: unha cálida, dúas temperadas e dúas frías. A cálida queda no centro; as frías, nos extremos.","challenge":"Como inflúe o ecuador no clima? Nomea as cinco zonas climáticas.","answer":"Preto do ecuador, os raios solares chegan máis perpendiculares e vai máis calor. Ao afastarnos, as temperaturas baixan. Hai unha zona cálida, dúas temperadas e dúas frías.","keyIdeas":["Preto do ecuador: máis calor","Ao afastarnos: menos temperatura","Unha cálida, dúas temperadas e dúas frías"]},"es":{"title":"El ecuador y las zonas","cue":"1 cálida. 2 templadas. 2 frías.","phrase":"Cerca del ecuador hace más calor; al alejarnos, las temperaturas van bajando.","explain":"Cerca del ecuador, los rayos solares llegan más perpendiculares y hace más calor. Al alejarnos de él, las temperaturas van bajando. Distinguimos cinco zonas: una cálida, dos templadas y dos frías. La cálida queda en el centro; las frías, en los extremos.","challenge":"¿Cómo influye el ecuador en el clima? Nombra las cinco zonas climáticas.","answer":"Cerca del ecuador, los rayos solares llegan más perpendiculares y hace más calor. Al alejarnos, las temperaturas bajan. Hay una zona cálida, dos templadas y dos frías.","keyIdeas":["Cerca del ecuador: más calor","Al alejarnos: menos temperatura","Una cálida, dos templadas y dos frías"]}},{"id":"relief","group":"factors","art":"relief","gl":{"title":"O relevo: a altura","cue":"Máis altura, máis frío.","phrase":"Nas montañas vai máis frío ca nas terras de menor altura.","explain":"Nunha mesma zona climática pode haber climas distintos porque a altura cambia as temperaturas. Nas montañas vai máis frío ca nas terras de menor altura: canto máis subimos, máis baixa adoita ser a temperatura.","challenge":"Por que pode facer máis frío no alto dunha montaña ca ao seu pé?","answer":"Porque a altura inflúe na temperatura. Nas montañas vai máis frío ca nas terras de menor altura; por iso pode haber climas distintos dentro dunha mesma zona climática.","keyIdeas":["A altura inflúe na temperatura","Máis altura: máis frío","Climas distintos nunha mesma zona"]},"es":{"title":"El relieve: la altura","cue":"Más altura, más frío.","phrase":"En las montañas hace más frío que en las tierras de menor altura.","explain":"En una misma zona climática puede haber climas distintos porque la altura cambia las temperaturas. En las montañas hace más frío que en las tierras de menor altura: cuanto más subimos, más baja suele ser la temperatura.","challenge":"¿Por qué puede hacer más frío en lo alto de una montaña que a sus pies?","answer":"Porque la altura influye en la temperatura. En las montañas hace más frío que en las tierras de menor altura; por eso puede haber climas distintos dentro de una misma zona climática.","keyIdeas":["La altura influye en la temperatura","Más altura: más frío","Climas distintos en una misma zona"]}},{"id":"sea","group":"factors","art":"relief","gl":{"title":"A distancia ao mar","cue":"Costa: temperaturas máis suaves.","phrase":"O mar suaviza as temperaturas: na costa son menos extremas ca no interior.","explain":"A distancia ao mar tamén inflúe no clima. As costas teñen temperaturas máis suaves, é dicir, menos extremas, ca as terras do interior. Por iso non abonda con mirar só a proximidade ao ecuador ou a altura.","challenge":"Compara as temperaturas da costa coas do interior. Que factor explica a diferenza?","answer":"As temperaturas da costa son máis suaves ca as do interior. A diferenza débese á influencia do mar: a distancia ao mar é un factor do clima.","keyIdeas":["Costa: temperaturas máis suaves","Interior: temperaturas máis extremas","Inflúe a distancia ao mar"]},"es":{"title":"La distancia al mar","cue":"Costa: temperaturas más suaves.","phrase":"El mar suaviza las temperaturas: en la costa son menos extremas que en el interior.","explain":"La distancia al mar también influye en el clima. Las costas tienen temperaturas más suaves, es decir, menos extremas, que las tierras del interior. Por eso no basta con mirar solo la proximidad al ecuador o la altura.","challenge":"Compara las temperaturas de la costa con las del interior. ¿Qué factor explica la diferencia?","answer":"Las temperaturas de la costa son más suaves que las del interior. La diferencia se debe a la influencia del mar: la distancia al mar es un factor del clima.","keyIdeas":["Costa: temperaturas más suaves","Interior: temperaturas más extremas","Influye la distancia al mar"]}},{"id":"families","group":"base","art":"families","gl":{"title":"Tres grandes grupos","cue":"Cálidos. Temperados. Fríos.","phrase":"Hai tres grupos de climas; as temperaturas e as precipitacións explican a vexetación.","explain":"Hai tres grupos de climas: cálidos, temperados e fríos. Os cálidos sitúanse arredor do ecuador; os temperados, entre a zona cálida e as frías, teñen estacións diferenciadas. As temperaturas e as precipitacións dan lugar a vexetacións e paisaxes características.","challenge":"Nomea os tres grupos e explica como se relaciona o clima coa paisaxe.","answer":"Os tres grupos son os climas cálidos, temperados e fríos. As temperaturas e as precipitacións de cada clima fan que medre unha vexetación característica, que vemos nas paisaxes.","keyIdeas":["Cálidos, temperados e fríos","Temperaturas e precipitacións","Vexetación e paisaxes características"]},"es":{"title":"Tres grandes grupos","cue":"Cálidos. Templados. Fríos.","phrase":"Hay tres grupos de climas; las temperaturas y las precipitaciones explican la vegetación.","explain":"Hay tres grupos de climas: cálidos, templados y fríos. Los cálidos se sitúan alrededor del ecuador; los templados, entre la zona cálida y las frías, tienen estaciones diferenciadas. Las temperaturas y las precipitaciones dan lugar a vegetaciones y paisajes característicos.","challenge":"Nombra los tres grupos y explica cómo se relaciona el clima con el paisaje.","answer":"Los tres grupos son los climas cálidos, templados y fríos. Las temperaturas y las precipitaciones de cada clima hacen que crezca una vegetación característica, que vemos en los paisajes.","keyIdeas":["Cálidos, templados y fríos","Temperaturas y precipitaciones","Vegetación y paisajes característicos"]}},{"id":"equatorial","group":"warm","art":"equatorial","gl":{"title":"Clima ecuatorial","cue":"Calor. Moita choiva. Humidade. Selva.","phrase":"No clima ecuatorial vai calor, chove moito e medran selvas.","explain":"O clima ecuatorial é un clima cálido próximo ao ecuador. Vai calor e hai moita humidade porque chove moito. Estas condicións permiten que medre unha vexetación moi densa: a selva.","challenge":"Explica como é o clima ecuatorial e por que medran selvas.","answer":"O clima ecuatorial é cálido e está preto do ecuador. Vai calor, chove moito e hai moita humidade. Por iso medran selvas de vexetación moi densa.","keyIdeas":["Clima cálido, preto do ecuador","Moita choiva e humidade","Selvas"]},"es":{"title":"Clima ecuatorial","cue":"Calor. Mucha lluvia. Humedad. Selva.","phrase":"En el clima ecuatorial hace calor, llueve mucho y crecen selvas.","explain":"El clima ecuatorial es un clima cálido próximo al ecuador. Hace calor y hay mucha humedad porque llueve mucho. Estas condiciones permiten que crezca una vegetación muy densa: la selva.","challenge":"Explica cómo es el clima ecuatorial y por qué crecen selvas.","answer":"El clima ecuatorial es cálido y está cerca del ecuador. Hace calor, llueve mucho y hay mucha humedad. Por eso crecen selvas de vegetación muy densa.","keyIdeas":["Clima cálido, cerca del ecuador","Mucha lluvia y humedad","Selvas"]}},{"id":"tropical","group":"warm","art":"tropical","gl":{"title":"Clima tropical seco","cue":"Choiva nunha estación. Sabana.","phrase":"No tropical seco, as choivas concéntranse nunha estación e aparece a sabana.","explain":"O clima tropical seco é cálido. Ao afastarnos do ecuador, as choivas concéntranse nunha estación do ano. A vexetación é menos densa ca na selva; a súa paisaxe característica é a sabana.","challenge":"En que se diferencia o clima tropical seco do ecuatorial?","answer":"Os dous son climas cálidos. No tropical seco, as choivas concéntranse nunha estación e a vexetación é menos densa: a sabana. No ecuatorial chove moito e medran selvas.","keyIdeas":["Os dous son cálidos","Tropical seco: choiva nunha estación e sabana","Ecuatorial: moita choiva e selva"]},"es":{"title":"Clima tropical seco","cue":"Lluvia en una estación. Sabana.","phrase":"En el tropical seco, las lluvias se concentran en una estación y aparece la sabana.","explain":"El clima tropical seco es cálido. Al alejarnos del ecuador, las lluvias se concentran en una estación del año. La vegetación es menos densa que en la selva; su paisaje característico es la sabana.","challenge":"¿En qué se diferencia el clima tropical seco del ecuatorial?","answer":"Los dos son climas cálidos. En el tropical seco, las lluvias se concentran en una estación y la vegetación es menos densa: la sabana. En el ecuatorial llueve mucho y crecen selvas.","keyIdeas":["Los dos son cálidos","Tropical seco: lluvia en una estación y sabana","Ecuatorial: mucha lluvia y selva"]}},{"id":"desert","group":"warm","art":"desert","gl":{"title":"Clima desértico","cue":"Case sen choiva. Poucas plantas.","phrase":"Nos desertos apenas chove; por iso medra moi pouca vexetación.","explain":"Nos desertos cálidos apenas chove. Como falta auga, medra moi pouca vexetación. Pode haber cactos e, nos lugares con auga, palmeiras. A escaseza de precipitacións é a idea principal para recoñecer este clima.","challenge":"Por que hai tan pouca vexetación nos desertos? Pon exemplos de plantas.","answer":"Nos desertos apenas chove e falta auga, por iso medra moi pouca vexetación. Pode haber cactos e, onde hai auga, palmeiras.","keyIdeas":["Precipitacións moi escasas","Falta auga e hai pouca vexetación","Cactos; palmeiras onde hai auga"]},"es":{"title":"Clima desértico","cue":"Casi sin lluvia. Pocas plantas.","phrase":"En los desiertos apenas llueve; por eso crece muy poca vegetación.","explain":"En los desiertos cálidos apenas llueve. Como falta agua, crece muy poca vegetación. Puede haber cactus y, en los lugares con agua, palmeras. La escasez de precipitaciones es la idea principal para reconocer este clima.","challenge":"¿Por qué hay tan poca vegetación en los desiertos? Pon ejemplos de plantas.","answer":"En los desiertos apenas llueve y falta agua, por eso crece muy poca vegetación. Puede haber cactus y, donde hay agua, palmeras.","keyIdeas":["Precipitaciones muy escasas","Falta agua y hay poca vegetación","Cactus; palmeras donde hay agua"]}},{"id":"mediterranean","group":"temperate","art":"mediterranean","gl":{"title":"Clima mediterráneo","cue":"Pouca choiva. Verán quente.","phrase":"Chove pouco e vai calor no verán; o bosque adáptase á seca.","explain":"O mediterráneo é un clima temperado. Ten choivas escasas e temperaturas altas no verán. A súa vexetación característica é o bosque mediterráneo, con plantas adaptadas á seca, é dicir, a pasar períodos con pouca auga.","challenge":"Como son as temperaturas, as choivas e a vexetación do clima mediterráneo?","answer":"No clima mediterráneo, as choivas son escasas e as temperaturas son altas no verán. Hai bosque mediterráneo, adaptado á seca e á falta de auga.","keyIdeas":["Choivas escasas","Temperaturas altas no verán","Bosque mediterráneo adaptado á seca"]},"es":{"title":"Clima mediterráneo","cue":"Poca lluvia. Verano caluroso.","phrase":"Llueve poco y hace calor en verano; el bosque se adapta a la sequía.","explain":"El mediterráneo es un clima templado. Tiene lluvias escasas y temperaturas altas en verano. Su vegetación característica es el bosque mediterráneo, con plantas adaptadas a la sequía, es decir, a pasar períodos con poca agua.","challenge":"¿Cómo son las temperaturas, las lluvias y la vegetación del clima mediterráneo?","answer":"En el clima mediterráneo, las lluvias son escasas y las temperaturas son altas en verano. Hay bosque mediterráneo, adaptado a la sequía y a la falta de agua.","keyIdeas":["Lluvias escasas","Temperaturas altas en verano","Bosque mediterráneo adaptado a la sequía"]}},{"id":"oceanic","group":"temperate","art":"oceanic","gl":{"title":"Clima oceánico","cue":"Choivas abundantes. Temperaturas suaves. Bosques, pradarías.","phrase":"No clima oceánico chove moito, as temperaturas son suaves e hai pradarías.","explain":"O oceánico é un clima temperado no que chove moito e as temperaturas son suaves. A auga favorece a vexetación: hai bosques e pradarías. Para recoñecelo, lembra as dúas pistas xuntas: choivas abundantes e temperaturas suaves.","challenge":"Describe o clima oceánico e compárao co mediterráneo.","answer":"No clima oceánico chove moito e as temperaturas son suaves; hai bosques e pradarías. No mediterráneo chove pouco, vai calor no verán e o bosque está adaptado á seca.","keyIdeas":["Oceánico: moita choiva e temperaturas suaves","Oceánico: bosques e pradarías","Mediterráneo: pouca choiva e verán quente"]},"es":{"title":"Clima oceánico","cue":"Lluvias abundantes. Temperaturas suaves. Bosques, praderas.","phrase":"En el clima oceánico llueve mucho, las temperaturas son suaves y hay praderas.","explain":"El oceánico es un clima templado en el que llueve mucho y las temperaturas son suaves. El agua favorece la vegetación: hay bosques y praderas. Para reconocerlo, recuerda las dos pistas juntas: lluvias abundantes y temperaturas suaves.","challenge":"Describe el clima oceánico y compáralo con el mediterráneo.","answer":"En el clima oceánico llueve mucho y las temperaturas son suaves; hay bosques y praderas. En el mediterráneo llueve poco, hace calor en verano y el bosque está adaptado a la sequía.","keyIdeas":["Oceánico: mucha lluvia y temperaturas suaves","Oceánico: bosques y praderas","Mediterráneo: poca lluvia y verano caluroso"]}},{"id":"continental","group":"temperate","art":"continental","gl":{"title":"Clima continental","cue":"Inverno frío. Verán cálido. Taiga, estepas.","phrase":"Invernos moi fríos; veráns cálidos con choivas. Hai bosques de taiga e estepas.","explain":"O continental é un clima temperado con grandes diferenzas entre estacións. Os invernos son moi fríos e os veráns son cálidos e con choivas. A súa vexetación inclúe bosques de taiga e estepas.","challenge":"Que diferenzas hai entre o inverno e o verán no clima continental? Que vexetación hai?","answer":"No clima continental, os invernos son moi fríos e os veráns son cálidos e con choivas. Hai bosques de taiga e estepas.","keyIdeas":["Invernos moi fríos","Veráns cálidos con choivas","Bosques de taiga e estepas"]},"es":{"title":"Clima continental","cue":"Invierno frío. Verano cálido. Taiga, estepas.","phrase":"Inviernos muy fríos; veranos cálidos con lluvias. Hay bosques de taiga y estepas.","explain":"El continental es un clima templado con grandes diferencias entre estaciones. Los inviernos son muy fríos y los veranos son cálidos y con lluvias. Su vegetación incluye bosques de taiga y estepas.","challenge":"¿Qué diferencias hay entre el invierno y el verano en el clima continental? ¿Qué vegetación hay?","answer":"En el clima continental, los inviernos son muy fríos y los veranos son cálidos y con lluvias. Hay bosques de taiga y estepas.","keyIdeas":["Inviernos muy fríos","Veranos cálidos con lluvias","Bosques de taiga y estepas"]}},{"id":"polar","group":"cold","art":"polar","gl":{"title":"Clima polar","cue":"Sempre moi frío. Pouca precipitación. Tundra.","phrase":"Preto dos polos vai moito frío, precipita pouco e pode haber tundra.","explain":"O clima polar dáse arredor dos polos Norte e Sur. Vai moito frío todo o ano. As precipitacións son escasas e adoitan ser en forma de neve. Apenas medra vexetación; onde é posible, hai tundra, con musgo e herbas.","challenge":"Onde está o clima polar? Explica as temperaturas, as precipitacións e a vexetación.","answer":"O clima polar está arredor dos polos Norte e Sur. Vai moito frío todo o ano e as precipitacións son escasas, normalmente de neve. Apenas hai vexetación; onde medra, hai tundra, con musgo e herbas.","keyIdeas":["Arredor dos polos: moito frío todo o ano","Pouca precipitación, normalmente neve","Vexetación escasa: tundra, musgo e herbas"]},"es":{"title":"Clima polar","cue":"Siempre mucho frío. Poca precipitación. Tundra.","phrase":"Cerca de los polos hace mucho frío, precipita poco y puede haber tundra.","explain":"El clima polar se da alrededor de los polos Norte y Sur. Hace mucho frío todo el año. Las precipitaciones son escasas y suelen ser en forma de nieve. Apenas crece vegetación; donde es posible, hay tundra, con musgo y hierbas.","challenge":"¿Dónde está el clima polar? Explica las temperaturas, las precipitaciones y la vegetación.","answer":"El clima polar está alrededor de los polos Norte y Sur. Hace mucho frío todo el año y las precipitaciones son escasas, normalmente de nieve. Apenas hay vegetación; donde crece, hay tundra, con musgo y hierbas.","keyIdeas":["Alrededor de los polos: mucho frío todo el año","Poca precipitación, normal metro: temperatura en °C","Pluviómetro: precipitación","Datos durante muchos años"]}},{"id":"x03","topic":"zones","art":"zones","gl":{"q":"Por que a zona cálida está preto do ecuador e as frías preto dos polos?","answer":"Preto do ecuador os raios solares chegan máis perpendiculares e quentan máis. Ao afastarnos del, as temperaturas van descendendo. Por iso hai unha zona cálida central, dúas temperadas e dúas frías preto dos polos.","keyIdeas":["Raios máis perpendiculares no ecuador","Temperaturas menores cara aos polos","Unha cálida, dúas temperadas e dúas frías"]},"es":{"q":"¿Por qué la zona cálida está cerca del ecuador y las frías cerca de los polos?","answer":"Cerca del ecuador los rayos solares llegan más perpendiculares y calientan más. Al alejarnos de él, las temperaturas van descendiendo. Por eso hay una zona cálida central, dos templadas y dos frías cerca de los polos.","keyIdeas":["Rayos más perpendiculares en el ecuador","Temperaturas menores hacia los polos","Una cálida, dos templadas y dos frías"]}},{"id":"x04","topic":"families","art":"families","gl":{"q":"A lección fala de tres grupos de climas e de cinco zonas. Como poden ser certas as dúas cousas?","answer":"Os tres grupos son os climas cálidos, temperados e fríos. As zonas son cinco porque hai unha cálida, dúas temperadas e dúas frías. Hai unha zona temperada e unha fría a cada lado da zona cálida.","keyIdeas":["Tres grupos: cálidos, temperados e fríos","Cinco zonas: 1 + 2 + 2","As temperadas e as frías están nos dous lados"]},"es":{"q":"La lección habla de tres grupos de climas y de cinco zonas. ¿Cómo pueden ser ciertas las dos cosas?","answer":"Los tres grupos son los climas cálidos, templados y fríos. Las zonas son cinco porque hay una cálida, dos templadas y dos frías. Hay una zona templada y una fría a cada lado de la zona cálida.","keyIdeas":["Tres grupos: cálidos, templados y fríos","Cinco zonas: 1 + 2 + 2","Las templadas y las frías están a los dos lados"]}},{"id":"x05","topic":"relief","art":"relief","gl":{"q":"Dous lugares están igual de preto do ecuador, pero un está nunha alta montaña. Por que poden ter climas distintos?","answer":"A proximidade ao ecuador non é o único factor do clima. Tamén inflúe o relevo: nas montañas vai máis frío ca nas terras de menor altura. A alta montaña ten un clima frío con precipitacións frecuentes.","keyIdeas":["Inflúen varios factores","A maior altura, máis frío","Alta montaña: frío e precipitacións frecuentes"]},"es":{"q":"Dos lugares están igual de cerca del ecuador, pero uno está en una alta montaña. ¿Por qué pueden tener climas distintos?","answer":"La proximidad al ecuador no es el único factor del clima. También influye el relieve: en las montañas hace más frío que en las tierras de menor altura. La alta montaña tiene un clima frío con precipitaciones frecuentes.","keyIdeas":["Influyen varios factores","A mayor altura, más frío","Alta montaña: frío y precipitaciones frecuentes"]}},{"id":"x06","topic":"sea","art":"relief","gl":{"q":"Unha vila está na costa e outra no interior. Se as demais condicións son parecidas, onde esperas temperaturas máis suaves? Por que?","answer":"Espero temperaturas máis suaves na vila da costa. O mar suaviza as temperaturas, mentres que nas terras do interior os cambios poden ser maiores. A distancia ao mar é un dos factores que explican as diferenzas entre climas.","keyIdeas":["Na costa, máis suaves","Influencia do mar","A distancia ao mar inflúe no clima"]},"es":{"q":"Un pueblo está en la costa y otro en el interior. Si las demás condiciones son parecidas, ¿dónde esperas temperaturas más suaves? ¿Por qué?","answer":"Espero temperaturas más suaves en el pueblo de la costa. El mar suaviza las temperaturas, mientras que en las tierras del interior los cambios pueden ser mayores. La distancia al mar es uno de los factores que explican las diferencias entre climas.","keyIdeas":["En la costa, más suaves","Influencia del mar","La distancia al mar influye en el clima"]}},{"id":"x07","topic":"equatorial","art":"equatorial","gl":{"q":"Compara a selva ecuatorial coa sabana tropical. Que teñen que ver as choivas coa súa vexetación?","answer":"No clima ecuatorial vai calor e chove moito, polo que medran selvas densas. No tropical seco as choivas concéntranse nunha estación. Por iso a sabana ten unha vexetación menos densa ca a selva.","keyIdeas":["Ecuatorial: calor e moita choiva","Tropical seco: choiva nunha estación","Selva máis densa ca sabana"]},"es":{"q":"Compara la selva ecuatorial con la sabana tropical. ¿Qué tienen que ver las lluvias con su vegetación?","answer":"En el clima ecuatorial hace calor y llueve mucho, por lo que crecen selvas densas. En el tropical seco las lluvias se concentran en una estación. Por eso la sabana tiene una vegetación menos densa que la selva.","keyIdeas":["Ecuatorial: calor y mucha lluvia","Tropical seco: lluvia en una estación","Selva más densa que sabana"]}},{"id":"x08","topic":"desert","art":"desert","gl":{"q":"Explica a relación entre a choiva e estas tres paisaxes: selva, sabana e deserto.","answer":"Na selva ecuatorial chove moito e a vexetación é densa. Na sabana tropical as choivas concéntranse nunha estación e a vexetación é menos densa. No deserto apenas chove e medra moi pouca vexetación.","keyIdeas":["Selva: moita choiva e vexetación densa","Sabana: choiva estacional e menos densidade","Deserto: case sen choiva e pouca vexetación"]},"es":{"q":"Explica la relación entre la lluvia y estos tres paisajes: selva, sabana y desierto.","answer":"En la selva ecuatorial llueve mucho y la vegetación es densa. En la sabana tropical las lluvias se concentran en una estación y la vegetación es menos densa. En el desierto apenas llueve y crece muy poca vegetación.","keyIdeas":["Selva: mucha lluvia y vegetación densa","Sabana: lluvia estacional y menor densidad","Desierto: casi sin lluvia y poca vegetación"]}},{"id":"x09","topic":"oceanic","art":"oceanic","gl":{"q":"Nos climas ecuatorial e oceánico chove moito. Son iguais? Compara temperatura, grupo e vexetación.","answer":"Os dous teñen choivas abundantes, pero non son iguais. O ecuatorial é cálido, vai calor e ten selvas. O oceánico é temperado, ten temperaturas suaves e a súa vexetación inclúe bosques e pradarías.","keyIdeas":["Os dous: moita choiva","Ecuatorial: cálido, calor e selva","Oceánico: temperado, suave, bosques e pradarías"]},"es":{"q":"En los climas ecuatorial y oceánico llueve mucho. ¿Son iguales? Compara temperatura, grupo y vegetación.","answer":"Los dos tienen lluvias abundantes, pero no son iguales. El ecuatorial es cálido, hace calor y tiene selvas. El oceánico es templado, tiene temperaturas suaves y su vegetación incluye bosques y praderas.","keyIdeas":["Los dos: mucha lluvia","Ecuatorial: cálido, calor y selva","Oceánico: templado, suave, bosques y praderas"]}},{"id":"x10","topic":"mediterranean","art":"mediterranean","gl":{"q":"Compara os climas mediterráneo e oceánico: choivas, temperaturas e vexetación.","answer":"Os dous pertencen aos climas temperados. O mediterráneo ten choivas escasas, veráns calorosos e un bosque adaptado á seca. No oceánico chove moito, as temperaturas son suaves e hai bosques e pradarías.","keyIdeas":["Os dous son temperados","Mediterráneo: pouca choiva, calor no verán, seca","Oceánico: moita choiva, suave, bosques e pradarías"]},"es":{"q":"Compara los climas mediterráneo y oceánico: lluvias, temperaturas y vegetación.","answer":"Los dos pertenecen a los climas templados. El mediterráneo tiene lluvias escasas, veranos calurosos y un bosque adaptado a la sequía. En el oceánico llueve mucho, las temperaturas son suaves y hay bosques y praderas.","keyIdeas":["Los dos son templados","Mediterráneo: poca lluvia, calor en verano, sequía","Oceánico: mucha lluvia, suave, bosques y praderas"]}},{"id":"x11","topic":"continental","art":"continental","gl":{"q":"Compara o inverno e o verán do clima continental. Que paisaxes lle asocia a lección?","answer":"No clima continental os invernos son moi fríos. Os veráns son cálidos e teñen choivas, polo que hai unha clara diferenza entre as estacións. A lección asóciao cos bosques de taiga e coas estepas.","keyIdeas":["Inverno: moi frío","Verán: cálido e con choivas","Taiga e estepas"]},"es":{"q":"Compara el invierno y el verano del clima continental. ¿Qué paisajes le asocia la lección?","answer":"En el clima continental los inviernos son muy fríos. Los veranos son cálidos y tienen lluvias, por lo que hay una clara diferencia entre las estaciones. La lección lo asocia con los bosques de taiga y con las estepas.","keyIdeas":["Invierno: muy frío","Verano: cálido y con lluvias","Taiga y estepas"]}},{"id":"x12","topic":"polar","art":"polar","gl":{"q":"Compara o clima polar co de alta montaña. En que se parecen e que diferenza de precipitacións destaca?","answer":"Os dous son climas fríos. O polar dáse arredor dos polos e ten precipitacións escasas, moitas veces en forma de neve. O de alta montaña está a grande altura e ten precipitacións frecuentes.","keyIdeas":["Os dous son fríos","Polar: polos e pouca precipitación","Alta montaña: altura e precipitacións frecuentes"]},"es":{"q":"Compara el clima polar con el de alta montaña. ¿En qué se parecen y qué diferencia de precipitaciones destaca?","answer":"Los dos son climas fríos. El polar se da alrededor de los polos y tiene precipitaciones escasas, muchas veces en forma de nieve. El de alta montaña está a gran altura y tiene precipitaciones frecuentes.","keyIdeas":["Los dos son fríos","Polar: polos y poca precipitación","Alta montaña: altura y precipitaciones frecuentes"]}},{"id":"x13","topic":"polar","art":"polar","gl":{"q":"Unha paisaxe ten musgos e herbas, moito frío todo o ano e pouca precipitación. Identifícaa e explica as pistas.","answer":"É a tundra que a lección relaciona co clima polar. O frío de todo o ano e as precipitacións escasas son pistas dese clima. A vexetación é escasa e baixa, como os musgos e as herbas.","keyIdeas":["Identifica tundra e clima polar","Frío todo o ano e pouca precipitación","Vexetación escasa: musgos e herbas"]},"es":{"q":"Un paisaje tiene musgos y hierbas, mucho frío todo el año y poca precipitación. Identifícalo y explica las pistas.","answer":"Es la tundra que la lección relaciona con el clima polar. El frío de todo el año y las precipitaciones escasas son pistas de ese clima. La vegetación es escasa y baja, como los musgos y las hierbas.","keyIdeas":["Identifica tundra y clima polar","Frío todo el año y poca precipitación","Vegetación escasa: musgos y hierbas"]}},{"id":"x14","topic":"families","art":"families","gl":{"q":"Cita tres factores que axudan a explicar por que dous lugares teñen climas distintos e di como inflúe cada un.","answer":"A proximidade ao ecuador inflúe: ao afastarnos del, as temperaturas descenden. A altura tamén inflúe: nas montañas vai máis frío. Ademais, a distancia ao mar importa porque as costas teñen temperaturas máis suaves ca o interior.","keyIdeas":["Máis lonxe do ecuador: máis frío","Máis altura: máis frío","Preto do mar: temperaturas máis suaves"]},"es":{"q":"Cita tres factores que ayudan a explicar por qué dos lugares tienen climas distintos y di cómo influye cada uno.","answer":"La proximidad al ecuador influye: al alejarnos de él, las temperaturas descienden. La altura también influye: en las montañas hace más frío. Además, la distancia al mar importa porque las costas tienen temperaturas más suaves que el interior.","keyIdeas":["Más lejos del ecuador: más frío","Más altura: más frío","Cerca del mar: temperaturas más suaves"]}},{"id":"x15","topic":"mediterranean","art":"mediterranean","gl":{"q":"Dous lugares están en zonas temperadas. Por que non ten que ser igual a súa vexetación? Pon un exemplo da lección.","answer":"Dentro das zonas temperadas hai climas distintos, con diferentes temperaturas e precipitacións. Por exemplo, o bosque mediterráneo está adaptado á seca. No clima oceánico chove moito e hai bosques e pradarías.","keyIdeas":["Unha zona pode ter varios climas","Temperaturas e precipitacións inflúen na vexetación","Exemplo correcto: mediterráneo fronte a oceánico"]},"es":{"q":"Dos lugares están en zonas templadas. ¿Por qué no tiene que ser igual su vegetación? Pon un ejemplo de la lección.","answer":"Dentro de las zonas templadas hay climas distintos, con diferentes temperaturas y precipitaciones. Por ejemplo, el bosque mediterráneo está adaptado a la sequía. En el clima oceánico llueve mucho y hay bosques y praderas.","keyIdeas":["Una zona puede tener varios climas","Temperaturas y precipitaciones influyen en la vegetación","Ejemplo correcto: mediterráneo frente a oceánico"]}}],"choiceLater":[{"id":"c02","topic":"climate","art":"globe","gl":{"q":"Que dúas cousas necesitamos coñecer para estudar un clima?","options":["Temperaturas e estradas","Precipitacións e edificios","Estradas e edificios","Temperaturas e precipitacións"],"explain":"Importa como son e como se distribúen ao longo do ano."},"es":{"q":"¿Qué dos cosas necesitamos conocer para estudiar un clima?","options":["Temperaturas y carreteras","Precipitaciones y edificios","Carreteras y edificios","Temperaturas y precipitaciones"],"explain":"Importa cómo son y cómo se distribuyen a lo largo del año."},"correct":3},{"id":"c09","topic":"zones","art":"zones","gl":{"q":"Onde chegan os raios solares máis perpendiculares?","options":["Preto do ecuador","Preto do polo Norte","Preto do polo Sur","En todas partes igual"],"explain":"Preto do ecuador os raios chegan máis perpendiculares e quentan máis."},"es":{"q":"¿Dónde llegan los rayos solares más perpendiculares?","options":["Cerca del ecuador","Cerca del polo Norte","Cerca del polo Sur","En todas partes igual"],"explain":"Cerca del ecuador los rayos llegan más perpendiculares y calientan más."},"correct":0},{"id":"c10","topic":"zones","art":"zones","gl":{"q":"En xeral, ao afastarnos do ecuador, a temperatura…","options":["Sobe","Non cambia","Sempre chega a 0 °C","Baixa"],"explain":"As temperaturas diminúen  es:{title:'Tres grupos de climas',group:'Grupo',types:'Tipos de clima',basics:'Conceptos y factores del clima',note:'Esta clasificación tiene tres grupos. Las cinco zonas climáticas se estudian en la ficha del ecuador.'}

function renderClassification(forPrint=false){
 const copy=CLASSIFICATION_COPY[state.lang],headingId=forPrint?'print-classification-title':'classification-title';
 return `<section class="climate-classification${forPrint?' print-classification':''}" aria-labelledby="${headingId}"><h2 id="${headingId}">${esc(copy.title)}</h2><table><thead><tr><th scope="col">${esc(copy.group)}</th><th scope="col">${esc(copy.types)}</th></tr></thead><tbody>${CLIMATE_GROUPS.map(group=>`<tr><th scope="row">${esc(t('groups')[group])}</th><td>${LESSONS.filter(l=>l.group===group).map(l=>esc(l[state.lang].title)).join(' · ')}</td></tr>`).join('')}</tbody></table><p class="classification-note">${esc(copy.note)}</p></section>`;

function renderStudy(){if(state.overview)return `<div class="section-head"><div><div class="eyebrow">${stepLabel(state.level)}</div><h2 style="margin-top:7px">${t('allNotes')}</h2></div>${button(t('backCards'),'overview','btn alt small')}</div><p class="map-note">${t('fullMap')}</p>${renderClassification()}<div class="overview-grid">${LESSONS.map((l,i)=>`<article class="overview-card"><div class="thumb" aria-hidden="true">${climateArt(l.art,state.lang)}</div><div class="eyebrow">${t('groups')[l.group]}</div><h3>${esc(l[state.lang].title)}</h3><p>${esc(studyText(l))}</p>${button(t('card')+' '+(i+1),'card','text-button',`data-index="${i}"`)}</article>`).join('')}</div><div class="study-bottom">${button(t('print'),'print','btn alt')}${button(t('try')+' →','to-play','btn')}</div>`;
 const l=LESSONS[state.index],d=l[state.lang],known=state.learned[state.level].includes(l.id),studied=state.learned[state.level].length;
 return `<div class="section-head"><div><div class="eyebrow">${t('flashcards')}</div><p>${t('levelHints')[state.level-1]}</p></div><div class="small-tools">${button(t('allNotes'),'overview','text-button')}<span class="count-pill">${state.index+1} / ${LESSONS.length}</span></div></div><article class="study-card"><div class="scene"><span class="scene-caption">${t('groups')[l.group]}</span>${climateArt(l.art,state.lang)}</div><div class="study-text level-${state.level}"><h2>${esc(d.title)}</h2>${state.hidden?`<p class="hidden-answer">${t('hidden')}</p>`:`<p class="lesson-answer">${esc(studyText(l))}</p>`}${state.level>=3&&!state.hidden?`<p class="lesson-subprompt">${t('say')}</p>`:''}${button(state.hidden?t('show'):t('hide'),'hide','text-button reveal')}</div></article><div class="study-nav">${button('← '+t('prev'),'prev','btn alt',state.index===0?'disabled':'')}<div class="middle">${button(known?'✓ '+t('know'):t('know')+' ✓','know','btn soft',`aria-label="${known?t('known'):t('know')}"`)}${button(t('next')+' →','next','btn alt',state.index===LESSONS.length-1?'disabled':'')}</div></div><div class="topic-picker"><label for="jump" class="sr-only">${t('jump')}</label><select id="jump" data-action="jump">${LESSONS.map((x,i)=>`<option value="${i}" ${state.index===i?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(x[state.lang].title)}</option>`).join('')}</select></div><div class="study-bottom"><span class="micro"><span class="mini-progress"><i style="width:${studied/LESSONS.length*100}%"></i></span>${studied} / ${LESSONS.length} ${t('studied')}</span>${button(t('try')+' →','to-play','btn')}</div>`;
}
function renderPlay(){const r=round();if(r?.done)return renderResult(r);if(r&&!state.paused)return renderQuestion(r);return renderSetup(r);}
function renderSetup(r){const self=state.level>=3;return `<div class="setup"><div class="setup-art" aria-hidden="true">${climateArt(state.level===4?'summit':'families',state.lang)}</div><div class="setup-content"><div class="eyebrow">${stepLabel(state.level)}</div><h2>${t('setupTitle')[state.level-1]}</h2><p>${t('setupDesc')[state.level-1]}</p>${r?`<div class="fine-note">${t('resumeNote')} ${r.i+1} / ${r.keys.length}.</div><div class="start-row">${button(t('continue')+' →','resume','btn')}</div><p class="micro" style="margin-top:14px">${t('newAfter')}</p>`:`<div class="setup-group"><span>${t('roundLength')}</span><div class="segmented">${[10,15].map(n=>button(n===10?t('shortRound'):t('wholeRound'),'count','',`data-count="${n}" aria-pressed="${state.count===n}"`)).join('')}</div></div>${!self?`<div class="setup-group"><span>${t('mode')}</span><div class="segmented">${['practice','exam'].map(m=>button(t(m),'style','',`data-style="${m}" aria-pressed="${state.style===m}"`)).join('')}</div></div>`:''}<p class="micro">${self?t('selfHelp'):t(state.style+'Help')}</p><div class="start-row">${button(t('start')+' →','start','btn gold')}${pending().length?button(t('reviewMistakes')+' · '+pending().length,'review','btn alt'):''}</div>`}</div></div><p class="fine-note">${t('noPressure')} ${t('noteShared')}</p>`;}
function orderedQuestions(level,count){const kind=KINDS[level-1],bank=BANKS[kind],seen=new Set(state.history.filter(h=>h.level===level).slice(-2).flatMap(h=>h.ids||[]));const pool=shuffle(bank).sort((a,b)=>Number(seen.has(a.id))-Number(seen.has(b.id)));let chosen=[];
 if(count===15){for(const lesson of LESSONS){const q=pool.find(x=>x.topic===lesson.id&&!chosen.includes(x));if(q)chosen.push(q);}}
 else{for(const [group,n]of [['base',2],['factors',2],['warm',2],['temperate',2],['cold',2]]){const topics=LESSONS.filter(l=>l.group===group).map(l=>l.id);let used=[];for(let i=0;i<n;i++){const q=pool.find(x=>topics.includes(x.topic)&&!used.includes(x.topic)&&!chosen.includes(x));if(q){chosen.push(q);used.push(q.topic);}}}}
 for(const q of pool){if(chosen.length>=count)break;if(!chosen.includes(q))chosen.push(q);}return shuffle(chosen.slice(0,count)).map(q=>({kind,id:q.id}));}
function makeCurrent(r){const q=getQ(r.keys[r.i]),n=r.level===1?q.gl.options.length:r.level===2?q.gl.chunks.length:0;let order=shuffle(Array.from({length:n},(_,i)=>i));if(n>1&&order.every((x,i)=>x===i))order.push(order.shift());r.current={order,selected:[],checks:[],revealed:false,checked:false,choice:null,typed:'',write:false,correct:false};}
function startRound(review=false){const keys=review?shuffle(pending()).slice(0,15):orderedQuestions(state.level,state.count);if(!keys.length)return;const r={uid:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),level:state.level,style:state.level>=3?'self':review?'practice':state.style,review,keys,i:0,answers:[],done:false,resultsSaved:false,date:new Date().toISOString()};makeCurrent(r);state.sessions[state.level]=r;state.paused=false;state.tab='play';statusText='';save();render();focusQuestion();}
function focusQuestion(){requestAnimationFrame(()=>{const h=document.getElementById('question-heading');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}});}
function renderQuestion(r){const q=getQ(r.keys[r.i]),d=q[state.lang],c=r.current,isExam=r.style==='exam',self=r.level>=3,completed=r.answers.filter(Boolean).filter(a=>a.correct).length;
 const label=r.level===1?t('choicePrompt'):r.level===2?t('buildPrompt'):r.level===3?t('explainPrompt'):t('connectPrompt');
 return `<div class="round-wrap"><div class="round-top"><span>${t('question')} <b>${r.i+1}</b> ${t('of')} ${r.keys.length}${r.review?' · '+t('reviewLabel'):''}</span><div class="round-right">${!isExam?`<span>${self?'✓':'★'} ${completed} ${self?(completed===1?'completa':t('selfScore')):(completed===1?(state.lang==='gl'?'acerto':'acierto'):t('points'))}</span>`:`<span>${t('exam')}</span>`}${button(t('pause'),'pause','text-button')}</div></div><div class="progress-track" role="progressbar" aria-valuenow="${r.i}" aria-valuemin="0" aria-valuemax="${r.keys.length}" aria-label="${t('question')}"><i style="width:${r.i/r.keys.length*100}%"></i></div><article class="question-card"><div class="question-kicker"><span class="badge">${state.level}</span>${label}<span style="margin-left:auto">${t('lengths')[state.level-1]}</span></div><h2 id="question-heading">${esc(d.q)}</h2>${r.level===1?renderChoice(q,c,isExam):r.level===2?renderBuild(q,c):renderOral(q,c)}${c.checked?renderFeedback(r,q):''}${c.checked?`<div class="round-next">${button(r.i===r.keys.length-1?t('finish'):t('next')+' →','next-question','btn gold','id="next-question"')}</div>`:''}</article></div>`;
}
function renderChoice(q,c,isExam){const d=q[state.lang];return `<div class="answers">${c.order.map((i,pos)=>{let cls='';if(c.checked){if(isExam){if(c.choice===i)cls=' selected';}else if(i===q.correct)cls=' correct';else if(c.choice===i)cls=' wrong';}return `<button type="button" class="answer${cls}" data-action="answer" data-option="${i}" ${c.checked?'disabled':''}><span class="letter" aria-hidden="true">${'ABCD'[pos]}</span><span>${esc(d.options[i])}</span></button>`;}).join('')}</div>`;}
function renderBuild(q,c){const d=q[state.lang];return `<div class="build-zone ${c.selected.length?'':'empty'}" aria-label="${t('yourAnswer')}">${c.selected.length?c.selected.map((v,i)=>button(esc(d.chunks[v]),'remove-word','word chosen',`data-pos="${i}" ${c.checked?'disabled':''}`)).join(''):t('buildEmpty')}</div>${!c.checked?`<div class="word-bank">${c.order.map(i=>button(esc(d.chunks[i]),'word','word',`data-word="${i}" ${c.selected.includes(i)?'disabled':''}`)).join('')}</div><div class="oral-actions">${button(t('check'),'check-build','btn',c.selected.length!==d.chunks.length?'disabled':'')}${button(t('undo'),'undo','text-button',!c.selected.length?'disabled':'')}</div>`:''}`;}
function renderOral(q,c){const d=q[state.lang];return `${!c.revealed?`<div class="oral-intro"><strong>${t('outLoud')}</strong>${t('oralHelp')}</div><div class="oral-actions">${button(t('compare'),'reveal-model','btn gold')}${!c.write?button(t('writeInstead'),'write','text-button'):''}</div>`:''}${c.write?`<label class="sr-only" for="oral-text">${t('yourAnswer')}</label><textarea id="oral-text" class="write-area" placeholder="${t('writePlaceholder')}" maxlength="2500" ${c.revealed?'readonly':''}>${esc(c.typed)}</textarea>`:''}${c.revealed?`<div class="model"><div class="eyebrow">${t('modelAnswer')}</div><p>${esc(d.answer)}</p><p style="margin-top:17px;font-weight:700;font-size:.88rem">${t('included')}</p><div class="checklist">${d.keyIdeas.map((idea,i)=>`<label class="checkitem"><input type="checkbox" data-check="${i}" ${c.checks.includes(i)?'checked':''} ${c.checked?'disabled':''}><span>${esc(idea)}</span></label>`).join('')}</div><p class="micro" style="margin-top:13px">${t('selfNote')}</p></div>${!c.checked?`<div class="round-next">${button(t('saveSelf'),'check-self','btn')}</div>`:''}`:''}`;}
function renderFeedback(r,q){const c=r.current,d=q[state.lang];if(r.style==='exam')return `<div class="feedback" role="status"><strong>${t('savedAnswer')}</strong>${t('examFeedback')}</div>`;if(r.level>=3)return `<div class="feedback ${c.correct?'good':'bad'}" role="status"><strong>${c.checks.length} / ${d.keyIdeas.length} ${t('ideas')}</strong>${c.correct?t('complete'):t('keepLearning')}</div>`;const expected=r.level===1?d.options[q.correct]:d.chunks.join(' ');return `<div class="feedback ${c.correct?'good':'bad'}" role="status"><strong class="${c.correct?'spark':''}">${c.correct?t('nice')[r.i%t('nice').length]:t('retry')}</strong>${esc(d.explain)}${!c.correct?`<div class="expected">${t('correctAnswer')} ${esc(expected)}</div>`:''}</div>`;}
function acceptAnswer(correct){const r=round(),c=r.current;if(c.checked)return;c.checked=true;c.correct=correct;r.answers[r.i]={ref:r.keys[r.i],correct,choice:c.choice,selected:c.selected.slice(),checks:c.checks.slice(),typed:c.typed,lang:state.lang};beep(correct,r.style==='exam');save();render();requestAnimationFrame(()=>document.getElementById('next-question')?.focus({preventScroll:true}));}
function finishRound(r){r.done=true;if(!r.resultsSaved){r.resultsSaved=true;const score=r.answers.filter(a=>a.correct).length;state.history.push({uid:r.uid,level:r.level,style:r.style,review:r.review,date:new Date().toISOString(),score,total:r.keys.length,lang:state.lang,ids:r.keys.map(x=>x.id)});state.history=state.history.slice(-100);for(const a of r.answers){state.mistakes=state.mistakes.filter(x=>refKey(x)!==refKey(a.ref));if(!a.correct)state.mistakes.push(a.ref);}}save();render();}
function renderResult(r){const score=r.answers.filter(a=>a.correct).length,total=r.keys.length,rate=score/total,self=r.level>=3,failed=r.answers.filter(a=>!a.correct);return `<div class="result-hero"><div class="art" aria-hidden="true">${climateArt('summit',state.lang)}</div><div><div class="eyebrow">${r.review?t('finishReview'):stepLabel(r.level)}</div><div class="result-score">${score}<span>/ ${total} ${self?t('selfOf'):t('rightOf')}</span></div><div class="stars" aria-hidden="true">${rate===1?'★★★':rate>=.7?'★★☆':rate>=.4?'★☆☆':'☆☆☆'}</div><h2 style="margin-top:10px">${rate===1?t('resultTitle'):rate>=.6?t('resultGood'):t('resultStart')}</h2><p>${self?t('selfResult'):rate===1?t('resultPerfect'):t('resultPractice')}</p><div class="result-actions">${failed.length?button(t('reviewPending')+' · '+failed.length,'review-result','btn gold'):button(t('again'),'again','btn gold')}${rate>=.8&&state.level<4?button(t('nextLevel')+' →','next-level','btn alt'):button(t('studyAgain'),'study-again','btn alt')}${failed.length?button(t('again'),'again','btn alt'):''}${button(t('newRound'),'new-round','text-button')}</div></div></div><div class="section-head" style="margin-top:28px"><h3>${t('reviewAnswers')}</h3><span class="micro">${total} ${t('answered')}</span></div><div class="review-list">${r.answers.map((a,i)=>renderReviewItem(a,i)).join('')}</div>`;}
function renderReviewItem(a,i){const q=getQ(a.ref),d=q[state.lang],isChoice=a.ref.kind==='choice',isBuild=a.ref.kind==='build',expected=isChoice?d.options[q.correct]:isBuild?d.chunks.join(' '):d.answer;const own=isChoice?d.options[a.choice]:isBuild?a.selected.map(j=>d.chunks[j]).join(' '):a.typed||t('notWritten');return `<details class="review-item" ${!a.correct?'open':''}><summary><span class="review-status ${a.correct?'':'miss'}">${a.correct?'✓':'↻'}</span><span>${i+1}. ${esc(d.q)}</span><span class="review-arrow">⌄</span></summary><div class="review-copy"><p><strong>${t('yourAnswer')}:</strong> ${esc(own)}</p><div class="model-answer"><strong>${isChoice||isBuild?t('correctAnswer'):t('modelAnswer')+':'}</strong> ${esc(expected)}</div>${d.explain?`<p style="margin-top:9px">${esc(d.explain)}</p>`:`<p style="margin-top:9px">${a.checks.length} / ${d.keyIdeas.length} ${t('ideas')} · ${t('selfLabel')}</p>`}</div></details>`;}
function renderProgress(){const any=state.history.length||Object.values(state.learned).some(x=>x.length);return `<div class="section-head"><div><h2>${t('progressTitle')}</h2><p style="margin-top:9px">${t('progressIntro')}</p></div></div><div class="progress-cards">${[1,2,3,4].map(l=>{const b=best(l),seen=state.learned[l].length;return `<article class="progress-card"><div class="eyebrow">${t('step')} ${l}</div><h3 style="margin-top:5px">${t('levels')[l-1]}</h3><div class="big-number">${b?Math.round(b.score/b.total*100)+'%':'—'}</div><p class="micro">${b?l>=3?t('selfLabel'):t('best'):t('noRounds')}</p><p class="micro" style="margin-top:9px">${seen} / 15 ${t('studied')}</p>${button(t('continueLearning'),'progress-level','btn small alt',`data-level="${l}"`)}</article>`;}).join('')}</div>${!any?`<div class="empty-state"><h3>${t('progressEmpty')}</h3><p>${t('progressEmptyDesc')}</p>${button(t('returnStudy'),'study-again','btn')}</div>`:''}${state.history.length?`<h3 style="margin-top:25px">${t('recent')}</h3><div class="history"><div class="history-row"><span>${t('date')}</span><span>${t('step')}</span><span>${t('score')}</span></div>${state.history.slice(-8).reverse().map(h=>`<div class="history-row"><span>${new Date(h.date).toLocaleDateString(state.lang==='gl'?'gl-ES':'es-ES',{day:'2-digit',month:'short'})}</span><span>${h.level} · ${t('levels')[h.level-1]}${h.review?' · '+t('reviewLabel'):h.style==='exam'?' · '+t('exam'):h.level>=3?' · '+t('selfLabel'):''}</span><span>${h.score} / ${h.total}</span></div>`).join('')}</div>`:''}<p class="fine-note">${t('selfResult')}</p>`;}
function renderFooter(active){return `<footer class="footer"><div class="footer-line"><span>◌ ${t('offline')}</span><span>${storageOK?'✓ '+t('localSave'):t('saveUnavailable')}</span><span>${t('version')}</span></div>${!storageOK?`<p class="fine-note">${t('storageError')}</p>`:''}<details id="backup-details"><summary>${t('backup')}</summary><div class="footer-content"><p>${t('backupText')}</p><p>${t('backupInfo')}</p><div class="backup-actions">${button(t('export'),'export','btn alt small')}${button(t('import'),'import','btn alt small')}${button(t('print'),'print','btn alt small')}</div><input id="import-file" type="file" accept=".json,application/json" hidden><p>${t('source')}</p><p>${t('noteShared')}</p></div></details><details><summary>${t('helpFamily')}</summary><div class="footer-content"><p>${t('familyText')}</p><p>${t('keyboard')}</p></div></details><div id="status" class="status" role="status" aria-live="polite"></div></footer>`;}
function updatePrint(){
 const copy=CLASSIFICATION_COPY[state.lang];
 const sections=[{title:copy.basics,items:LESSONS.filter(l=>!CLIMATE_GROUPS.includes(l.group))},...CLIMATE_GROUPS.map(group=>({title:t('groups')[group],items:LESSONS.filter(l=>l.group===group)}))];
 const cards=items=>items.map(l=>`<section class="print-card" data-lesson="${l.id}"><p class="print-category">${esc(t('groups')[l.group])}</p>${climateArt(l.art,state.lang)}<h3>${LESSONS.indexOf(l)+1}. ${esc(l[state.lang].title)}</h3><p>${esc(studyText(l))}</p></section>`).join('');
 document.getElementById('print-sheet').innerHTML=`<h1>${t('printTitle')}</h1><p class="print-sub">${stepLabel(state.level)} · ${t('printHelp')}</p>${renderClassification(true)}${sections.map(group=>`<section class="print-section"><h2 class="print-group-title">${esc(group.title)}</h2><div class="print-grid">${cards(group.items)}</div></section>`).join('')}<p class="print-note">${t('source')} · ${t('version')}</p>`;

function downloadProgress(){const payload={format:'climas-escaleira',version:1,exported:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='climas-progreso-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notifyStatus(t('exportOk'));}
function notifyStatus(msg){statusText=msg;const el=document.getElementById('status');if(el)el.textContent=msg;}
async function importProgress(file){try{if(!file||file.size>2*1024*1024)throw Error();const data=JSON.parse(await file.text());if(data.format!=='climas-escaleira'||data.version!==1||data.state?.version!==1||!data.state.learned||!Array.isArray(data.state.history))throw Error();const incoming=sanitize(data.state);for(let l=1;l<=4;l++){state.learned[l]=[...new Set([...state.learned[l],...incoming.learned[l]])];if(!state.sessions[l]&&incoming.sessions[l])state.sessions[l]=incoming.sessions[l];}const h=new Map([...incoming.history,...state.history].map(x=>[x.uid,x]));state.history=[...h.values()].sort((a,b)=>a.date.localeCompare(b.date)).slice(-100);const m=new Map([...incoming.mistakes,...state.mistakes].map(x=>[refKey(x),x]));state.mistakes=[...m.values()];save();statusText=t('importOk');render();document.getElementById('backup-details').open=true;}catch(e){notifyStatus(t('importError'));}}
app.addEventListener('input',e=>{if(e.target.id==='oral-text'){const r=round();if(r&&!r.current.revealed){r.current.typed=e.target.value;save();}}});
app.addEventListener('change',e=>{if(e.target.id==='jump'){state.index=Number(e.target.value);state.hidden=false;statusText='';save();render();}if(e.target.matches('[data-check]')){const r=round();if(!r||r.current.checked)return;const i=Number(e.target.dataset.check);r.current.checks=r.current.checks.filter(x=>x!==i);if(e.target.checked)r.current.checks.push(i);save();}if(e.target.id==='import-file')importProgress(e.target.files[0]);});
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,r=round(),c=r?.current;
 if(a==='lang'){if(state.lang===b.dataset.lang)return;state.lang=b.dataset.lang;statusText='';save();render();return;}
 if(a==='sound'){state.sound=!state.sound;beep(true,true);save();render();return;}
 if(a==='tab'){state.tab=b.dataset.tab;if(state.tab==='play')state.paused=false;statusText='';}
 if(a==='level'){state.level=Number(b.dataset.level);state.hidden=false;state.paused=false;statusText='';}
 if(a==='overview'){state.overview=!state.overview;state.hidden=false;}
 if(a==='hide')state.hidden=!state.hidden;
 if(a==='prev'||a==='next'){state.index=Math.max(0,Math.min(LESSONS.length-1,state.index+(a==='next'?1:-1)));state.hidden=false;statusText='';}
 if(a==='card'){state.index=Number(b.dataset.index);state.overview=false;state.hidden=false;}
 if(a==='know'){const id=LESSONS[state.index].id;if(!state.learned[state.level].includes(id)){state.learned[state.level].push(id);beep(true,true);}statusText=state.learned[state.level].length===15?t('passStudy'):t('finishedStudy');if(state.index<LESSONS.length-1)state.index++;state.hidden=false;}
 if(a==='to-play'){state.tab='play';state.paused=false;statusText='';}
 if(a==='count')state.count=Number(b.dataset.count);
 if(a==='style')state.style=b.dataset.style;
 if(a==='start'){startRound();return;}
 if(a==='review'){startRound(true);return;}
 if(a==='resume'){state.paused=false;statusText='';}
 if(a==='pause'){state.paused=true;statusText=t('exitPause');}
 if(a==='answer'){if(!r||c.checked)return;c.choice=Number(b.dataset.option);acceptAnswer(c.choice===getQ(r.keys[r.i]).correct);return;}
 if(a==='word'){if(!r||c.checked)return;const i=Number(b.dataset.word);if(!c.selected.includes(i))c.selected.push(i);}
 if(a==='remove-word'&&!c.checked)c.selected.splice(Number(b.dataset.pos),1);
 if(a==='undo'&&!c.checked)c.selected.pop();
 if(a==='check-build'){if(!r||c.checked)return;const n=getQ(r.keys[r.i])[state.lang].chunks.length;if(c.selected.length!==n)return;acceptAnswer(c.selected.every((x,i)=>x===i));return;}
 if(a==='write'){c.write=true;save();render();document.getElementById('oral-text').focus({preventScroll:true});return;}
 if(a==='reveal-model'){if(c.revealed)return;c.revealed=true;}
 if(a==='check-self'){if(!c.revealed)return;acceptAnswer(c.checks.length===getQ(r.keys[r.i])[state.lang].keyIdeas.length);return;}
 if(a==='next-question'){if(!c.checked)return;if(r.i===r.keys.length-1){finishRound(r);return;}r.i++;makeCurrent(r);save();render();focusQuestion();return;}
 if(a==='new-round'){if(r?.done){delete state.sessions[state.level];state.paused=false;statusText='';}}
 if(a==='again'){delete state.sessions[state.level];startRound();return;}
 if(a==='review-result'){const failed=r.answers.filter(x=>!x.correct).map(x=>x.ref);delete state.sessions[state.level];const nr={uid:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),level:state.level,style:state.level>=3?'self':'practice',review:true,keys:shuffle(failed),i:0,answers:[],done:false,resultsSaved:false,date:new Date().toISOString()};if(!nr.keys.length)return;makeCurrent(nr);state.sessions[state.level]=nr;state.paused=false;save();render();focusQuestion();return;}
 if(a==='next-level'){state.level=Math.min(4,state.level+1);state.tab='study';state.index=0;state.overview=false;state.hidden=false;}
 if(a==='study-again'){state.tab='study';state.overview=false;state.hidden=false;statusText='';}
 if(a==='progress-level'){state.level=Number(b.dataset.level);state.tab='study';state.overview=false;state.hidden=false;}
 if(a==='export'){downloadProgress();return;}
 if(a==='import'){document.getElementById('import-file').click();return;}
 if(a==='print'){updatePrint();window.print();return;}
 save();render();
});
save();render();

</script>
</body>
</html>
